// Exporta o SVG do fluxograma como PNG. O SVG na tela herda cor via CSS (var(--text) etc,
// definida no <style> da própria página) — pra virar arquivo, precisa resolver essas cores
// em valores concretos antes de serializar, porque uma vez fora do DOM da página o SVG
// não enxerga mais as variáveis do :root.
function baixarFluxogramaPNG(){
  const original = document.querySelector('#main svg');
  if(!original){ showToast('Abra o Fluxograma antes de baixar.', 'warn'); return; }
  showToast('Gerando imagem…', 'info');
  const svg = original.cloneNode(true);
  const cs = getComputedStyle(document.documentElement);
  const col = (name, fallback) => (cs.getPropertyValue(name)||'').trim() || fallback;
  const cText=col('--text','#201d1a'), cMuted=col('--muted','#6b6459'), cFaint=col('--faint','#9c948a'),
        cBgRaised=col('--bg-raised','#ffffff'), cBg=col('--bg','#f7f5f1'), cAccent=col('--accent','#12727d'),
        cInfoSoft=col('--info-soft','#dee6f2'), cAccentSoft=col('--accent-soft','#ddecec'),
        cWarnSoft=col('--warn-soft','#f7e9d4'), cOkSoft=col('--ok-soft','#e1f0e4'), cOk=col('--ok','#3b7a4c'), cWarn=col('--warn','#a86a1c');

  // tamanho real do desenho ativo (o simples e o técnico usam viewBox diferentes)
  const vb = (svg.getAttribute('viewBox')||'0 0 1100 980').split(/\s+/).map(Number);
  const W = vb[2] || 1100, H = vb[3] || 980;

  // classes do fluxograma técnico (o simples não usa classe, usa fill="var(...)" direto nos elementos)
  // filtro de sombra só existe no <defs> do modo "completo" — aplicar a referência nos outros modos
  // deixaria os nós invisíveis (SVG não renderiza elemento com filter apontando pra id inexistente).
  const shadowRule = fluxoModo==='completo' ? 'filter:url(#fxShadow)' : '';
  const styleEl = document.createElementNS('http://www.w3.org/2000/svg','style');
  styleEl.textContent = `
    text{font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
    .fxnode{fill:${cBgRaised};stroke:${cText};stroke-width:1.4;${shadowRule}}
    .fxnode.exit{fill:${cBg};stroke:${cFaint};stroke-width:1.2;stroke-dasharray:5 4;filter:none}
    .fxnode.terminal{fill:${cOkSoft};stroke:${cOk};stroke-width:2.2}
    .fxnode.decision{fill:${cAccentSoft};stroke:${cAccent}}
    .fxlane{fill:${cBg};opacity:.55;stroke:${cFaint};stroke-width:1;stroke-dasharray:3 4}
    .fxlanelbl{font-size:12px;font-weight:750;letter-spacing:.02em}
    .fxstart{fill:${cAccent};font-size:9.5px;font-weight:800;letter-spacing:.08em}
    .fxstartchip{fill:${cAccentSoft}}
    .fxlbl{font-size:14px;font-weight:700;fill:${cText}}
    .fxsub{font-size:10.5px;fill:${cMuted}}
    .fxexitlbl{font-size:12px;font-weight:700;fill:${cText}}
    .fxexittag{font-size:9px;font-weight:800;letter-spacing:.08em;fill:${cFaint}}
    .fxedge{fill:none;stroke:${cText};stroke-width:1.4}
    .fxedge.dashed{stroke:${cFaint};stroke-dasharray:4 4}
    .fxedge.accent{stroke:${cAccent};stroke-width:1.8}
    .fxedge.loop{stroke:${cWarn};stroke-width:1.7;stroke-dasharray:6 4}
    .fxet{font-size:10.5px;fill:${cMuted}}
    .fxet.accent{fill:${cAccent};font-weight:700}
    .fxet.loop{fill:${cWarn};font-weight:700}
    .fxet.dashed{fill:${cMuted}}
    .fxnode.warn{fill:${cWarnSoft};stroke:${cWarn};stroke-width:1.4}
  `;
  svg.insertBefore(styleEl, svg.firstChild);

  // resolve qualquer fill/stroke="var(--nome)" inline (usado no fluxograma simples e nos marcadores
  // de seta dos dois) — fora do DOM da página, o SVG não enxerga mais as variáveis do :root.
  const mapa = {'--text':cText,'--muted':cMuted,'--faint':cFaint,'--bg-raised':cBgRaised,'--bg':cBg,
    '--accent':cAccent,'--info-soft':cInfoSoft,'--accent-soft':cAccentSoft,'--warn-soft':cWarnSoft,'--ok-soft':cOkSoft,'--ok':cOk,'--warn':cWarn};
  svg.querySelectorAll('*').forEach(el=>{
    ['fill','stroke'].forEach(attr=>{
      const v = el.getAttribute(attr);
      if(v && v.startsWith('var(')){
        const nome = v.slice(4, v.indexOf(')')).split(',')[0].trim();
        if(mapa[nome]) el.setAttribute(attr, mapa[nome]);
      }
    });
  });

  const bgRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bgRect.setAttribute('width', W); bgRect.setAttribute('height', H); bgRect.setAttribute('fill', cBg);
  svg.insertBefore(bgRect, svg.firstChild);
  svg.setAttribute('width', W); svg.setAttribute('height', H);

  const svgData = new XMLSerializer().serializeToString(svg);
  const svgUrl = URL.createObjectURL(new Blob([svgData], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  img.onload = function(){
    const scale = 2; // retina
    const canvas = document.createElement('canvas');
    canvas.width = W*scale; canvas.height = H*scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(svgUrl);
    canvas.toBlob(blob=>{
      const link = document.createElement('a');
      link.download = {simples:'fluxograma-simples', tecnico:'fluxograma-tecnico', completo:'fluxograma-tecnico-completo'}[fluxoModo] + '-transferencia-assistida.png';
      link.href = URL.createObjectURL(blob);
      document.body.appendChild(link); link.click(); link.remove();
      showToast('Imagem baixada.', 'ok');
    });
  };
  img.onerror = function(){ URL.revokeObjectURL(svgUrl); showToast('Não consegui gerar a imagem — tenta de novo.', 'warn'); };
  img.src = svgUrl;
}

function renderAdmin(){
  const all = [...ALERTS].sort((a,b)=>b.id-a.id);
  const rows = all.map(a=>{
    const c = findCase(a.caseId);
    const tipoLabel = TIPO_ALERTA_LABEL[a.tipo] || a.tipo;
    const destinoLabel = a.destino.map(d=>{
      const r = ROLES.find(x=>x.key===d);
      return r ? r.label : (d==='admin'?'Administração':d);
    }).join(', ');
    return `<tr>
      <td>${a.resolvido ? '<span class="badge muted">Resolvido</span>' : '<span class="badge warn">Pendente</span>'}</td>
      <td class="unid" onclick="openDetailModal(${c.id})">${c.unidade}</td>
      <td>${c.cliente}</td>
      <td>${tipoLabel}</td>
      <td class="sub">${esc(a.motivo)}</td>
      <td class="sub">${destinoLabel}</td>
      <td class="sub">${a.criadoEm}</td>
    </tr>`;
  }).join('');

  const ativas = sortByPriority(DB.filter(c=>!['concluido','encerrado','resolvido_cef','distratado','cancelado_adm'].includes(c.macro)));
  const ativasRows = ativas.map(c=>`<tr data-caseid="${c.id}" data-search="${searchAttr(c)}" data-subfase="${esc(c.subFase||'')}">
    <td><div class="unid" onclick="openDetailModal(${c.id})">${c.unidade}</div><div class="sub">${c.empreendimento} · ${fmtMoney(c.valor)}</div></td>
    <td>${c.cliente}${c.analista?`<div class="sub">Analista: ${esc(c.analista)}</div>`:''}</td>
    <td>${bracoLabel(c.braco)}</td>
    <td>${badge(c.macro)}</td>
    <td><span class="dias ${c.dias>=8?'late':''}">${c.dias}d</span></td>
    <td>${renderTarefaCell(c)}</td>
    <td><button class="detailbtn" onclick="openDetailModal(${c.id})">🔍 Ver detalhes</button></td>
    <td style="text-align:right"><button class="act danger" onclick="openCancelUnidadeModal(${c.id})" title="Cancela a unidade em qualquer etapa — exclusivo da Administração">🛑 Cancelar unidade</button></td>
  </tr>`).join('');

  // Painel dos 180 dias — todas as unidades com elegibilidade calculada, mais urgentes primeiro
  const prazo = DB
    .filter(c=>!['concluido','encerrado','resolvido_cef','distratado','cancelado_adm'].includes(c.macro))
    .map(c=>({c, eleg:c.financeiro && c.financeiro.elegibilidade}))
    .filter(x=>x.eleg && x.eleg.diasRestantes!==null && x.eleg.diasRestantes<=30)
    .sort((a,b)=>a.eleg.diasRestantes-b.eleg.diasRestantes);
  const prazoRows = prazo.map(({c,eleg})=>{
    const vencido = eleg.diasRestantes<0;
    return `<tr data-caseid="${c.id}" data-search="${searchAttr(c)}">
      <td><div class="unid" onclick="openDetailModal(${c.id})">${c.unidade}</div><div class="sub">${c.empreendimento}</div></td>
      <td>${badge(c.macro)}</td>
      <td>${eleg.habiteSe}</td>
      <td><span class="badge ${vencido?'warn':'info'}">${vencido ? `Vencido há ${Math.abs(eleg.diasRestantes)}d` : `Faltam ${eleg.diasRestantes}d`}</span></td>
      <td><button class="detailbtn" onclick="openDetailModal(${c.id})">🔍 Ver detalhes</button></td>
    </tr>`;
  }).join('');

  // Esteira de Retomada — visão da Administração sobre todos os analistas de uma vez
  // (o Gestor já tem isso com poder de reatribuir; aqui é leitura estruturada: carga, saúde e fila de cada analista)
  const relacCases = sortByPriority(DB.filter(c=>['relacionamento','recompras'].includes(c.macro)));
  const hojeStr = new Date().toISOString().split('T')[0];
  const analistaStats = key=>{
    const cs = key===SEM_ATRIBUICAO ? relacCases.filter(c=>!c.analista) : relacCases.filter(c=>c.analista===key);
    return {
      cs,
      total: cs.length,
      contato: cs.filter(c=>c.macro==='relacionamento').length,
      procuracao: cs.filter(c=>c.macro==='recompras').length,
      sla: cs.filter(c=>c.macro==='relacionamento' && c.dias>7).length,
      tarefasAtrasadas: cs.reduce((n,c)=>n+(c.tarefas||[]).filter(t=>!t.concluida && t.data<hojeStr).length,0),
      agendamentos: cs.filter(c=>c.agendamentoData && c.agendamentoData>=hojeStr).length,
    };
  };
  const analistaKeys = [...ANALISTAS, SEM_ATRIBUICAO];
  const porAnalistaAdmin = analistaKeys.map(a=>{
    const st = analistaStats(a);
    const sem = a===SEM_ATRIBUICAO;
    const detalhes = sem
      ? 'precisa do Gestor distribuir'
      : `${st.contato} em contato · ${st.procuracao} rumo à procuração`
        + (st.sla ? ` · <b style="color:var(--warn)">${st.sla} SLA estourado</b>` : '')
        + (st.tarefasAtrasadas ? ` · <b style="color:var(--warn)">${st.tarefasAtrasadas} tarefa(s) atrasada(s)</b>` : '')
        + (st.agendamentos ? ` · ${st.agendamentos} agendamento(s)` : '');
    return `<div class="kpi clickable ${adminAnalistaFilter===a?'active':''}" onclick="admAnalistaSet('${esc(a)}')">
      <div class="lbl">${sem?'⚠ Sem atribuição':esc(a)}</div>
      <div class="val ${sem&&st.total?'bad':''}">${st.total}</div>
      <div class="sla">${detalhes}</div>
    </div>`;
  }).join('');
  const esteiraCases = adminAnalistaFilter ? analistaStats(adminAnalistaFilter).cs : relacCases;
  const esteiraBody = adminEsteiraViewMode==='board'
    ? renderEsteiraPorAnalistaBoard(relacCases)
    : (esteiraCases.length ? renderTable(esteiraCases, 'tblEsteiraAnalistas') : `<div class="empty">${adminAnalistaFilter?`Nenhum caso com ${adminAnalistaFilter===SEM_ATRIBUICAO?'"sem atribuição"':esc(adminAnalistaFilter)} no momento.`:'Nenhum caso em Relacionamento ou Recompras no momento.'}</div>`);

  return `
    <div class="pagehead">
      <div><h1><img class="navicon" src="icon_administracao.png" alt="" onerror="this.outerHTML='🛡️'"> Administração</h1><p>Visão executiva: todos os alertas de distrato (sinalizados e confirmados) em qualquer etapa do processo, além do raio-x geral. Só a Administração pode cancelar uma unidade em qualquer momento do fluxo.</p></div>

function openCancelUnidadeModal(id){
  const c = findCase(id);
  g('modalBox').className = 'modal warn-modal';
  g('modalBox').innerHTML = `
    <h3>🛑 Cancelar unidade</h3>
    <p><b>${c.unidade}</b> · ${c.empreendimento} · ${c.cliente}</p>
    <div class="warn-flag">⚠ Ação exclusiva da Administração. Cancela o caso imediatamente, em qualquer etapa (atualmente: ${MACRO_META[c.macro].label}), avisa a equipe que estava com o caso, e devolve a unidade ao estoque.</div>
    <label>Motivo do cancelamento</label>
    <textarea id="obsText" rows="3" placeholder="Ex: Unidade cancelada por decisão da diretoria — repriorização de portfólio."></textarea>
    <div class="btnrow"><button class="act ghost" onclick="closeModal()">Voltar</button><button class="act danger" onclick="confirmCancelUnidade(${id})">Confirmar cancelamento</button></div>
  `;
  g('modalOverlay').classList.add('show');
}
function confirmCancelUnidade(id){
  const c = findCase(id);
  const motivo = g('obsText').value || 'Sem motivo informado.';
  const prevMacro = c.macro;
  const prevLabel = MACRO_META[prevMacro].label;

  logHistory(c, `Unidade cancelada pela Administração — etapa encerrada (estava em: ${prevLabel})`, motivo);
  c.macro = 'cancelado_adm';
  c.subFase = undefined;

  macroToRoles(prevMacro).forEach(role=>{
    ALERTS.push({id: nextAlertId(), caseId:c.id, tipo:'cancelamento_admin', motivo, criadoEm: nowStr(), destino:[role], resolvido:false});
  });

  saveDB(); closeModal(); render();
}

function filterAssignRows(query){
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.assignrow[data-search]').forEach(row=>{
    const hay = row.getAttribute('data-search')||'';
    row.style.display = (!q || hay.includes(q)) ? '' : 'none';
  });
}
function toggleGestorCheck(id, checked){
  if(checked) gestorSelectedIds.add(id); else gestorSelectedIds.delete(id);
  updateGestorSelCount();
}
function updateGestorSelCount(){
  const el = g('gestorSelCount');
  if(el) el.textContent = gestorSelectedIds.size + ' selecionado(s)';
}
function toggleSelectAllGestor(checked){
  document.querySelectorAll('.assignrow').forEach(row=>{
    if(row.style.display==='none') return;
    const id = Number(row.getAttribute('data-caseid'));
    const cb = row.querySelector('.gestor-chk');
    if(cb) cb.checked = checked;
    if(checked) gestorSelectedIds.add(id); else gestorSelectedIds.delete(id);
  });
  updateGestorSelCount();
}
function clearGestorSelection(){
  gestorSelectedIds.clear();
  document.querySelectorAll('.gestor-chk').forEach(cb=>cb.checked=false);
  updateGestorSelCount();
}
function bulkAssignGestor(){
  const analista = g('bulkAnalista').value;
  const ids = [...gestorSelectedIds];
  if(!ids.length){ showToast('Selecione ao menos um caso.', 'warn'); return; }
  ids.forEach(id=>{
    const c = findCase(id);
    if(!c) return;
    const old = c.analista || '— sem atribuição —';
    c.analista = analista;
    logHistory(c, `Gestor reatribuiu o contato (em lote): ${old} → ${analista}`);
  });
  gestorSelectedIds.clear();
  saveDB(); render();
  showToast(`${ids.length} caso(s) atribuído(s) a ${analista}.`, 'ok');
}

function reassignAnalista(caseId, analista){
  const c = findCase(caseId);
  const old = c.analista || '— sem atribuição —';
  c.analista = analista || null;
  logHistory(c, `Gestor reatribuiu o contato: ${old} → ${analista || '— sem atribuição —'}`);
  saveDB(); render();
}
function distribuirAutomatico(){
  const cases = roleCases('relacionamento_gestor').filter(c=>!c.analista);
  cases.forEach((c,i)=>{
    const analista = ANALISTAS[i % ANALISTAS.length];
    c.analista = analista;
    logHistory(c, `Gestor distribuiu automaticamente: — sem atribuição — → ${analista}`);
  });
  saveDB(); render();
}

function searchAttr(c){

}
function tableToolbar(tid, cases){
  const subFases = cases ? [...new Set(cases.map(c=>c.subFase).filter(Boolean))] : [];
  const subFaseFilter = subFases.length ? `<select id="${tid}SubFaseFilter" onchange="applyTableFilter('${tid}')" title="Filtrar por fase — ver o que está parado em qual etapa">
      <option value="">Todas as fases</option>
      ${subFases.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}
    </select>` : '';
  return `<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap">
    <input type="text" id="${tid}SearchInput" placeholder="Buscar por unidade, cliente, empreendimento ou analista…" oninput="applyTableFilter('${tid}')" style="flex:1;min-width:180px;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg-raised);color:var(--text)">
    ${subFaseFilter}
    <span id="${tid}Count" class="sub" style="white-space:nowrap"></span>
    <button class="act" onclick="exportTableCSV('${tid}')">⬇ Exportar CSV</button>
  </div>`;
}
// Filtro combinado (busca de texto + fase) — os dois convivem, cada linha carrega data-search e data-subfase.
// O estado fica em tableFilterState pra sobreviver aos re-renders (toda ação reconstrói o HTML).
const tableFilterState = {};
function applyTableFilter(tid){
  const table = g(tid);
  if(!table) return;
  const searchEl = g(tid+'SearchInput');
  const subFaseEl = g(tid+'SubFaseFilter');
  const q = searchEl ? searchEl.value.toLowerCase().trim() : '';
  const sf = subFaseEl ? subFaseEl.value : '';
  tableFilterState[tid] = {q: searchEl ? searchEl.value : '', sf};
  let visible = 0, total = 0;
  table.querySelectorAll('tbody tr[data-search]').forEach(tr=>{
    const hay = tr.getAttribute('data-search')||'';
    const rowSf = tr.getAttribute('data-subfase')||'';
    const show = (!q || hay.includes(q)) && (!sf || rowSf===sf);
    tr.style.display = show ? '' : 'none';
    total++; if(show) visible++;
  });
  const countEl = g(tid+'Count');
  if(countEl) countEl.textContent = (q||sf) ? `${visible} de ${total}` : `${total}`;
}
// Compat: chamadas antigas continuam funcionando
function filterTableRows(tid, query){
  const el = g(tid+'SearchInput');
  if(el) el.value = query;
  applyTableFilter(tid);
}
// Reaplica busca + filtro de fase que o usuário tinha antes do re-render
function restoreTableFilter(tid){
  const st = tableFilterState[tid];
  if(!g(tid)) return;
  const searchEl = g(tid+'SearchInput');
  const subFaseEl = g(tid+'SubFaseFilter');
  if(st){
    if(searchEl) searchEl.value = st.q;
    if(subFaseEl) subFaseEl.value = st.sf;
  }
  applyTableFilter(tid);
}
function exportTableCSV(tid){
  const table = g(tid);
  if(!table) return;
  const rows = [...table.querySelectorAll('tbody tr[data-caseid]')].filter(tr=>tr.style.display!=='none');
  if(!rows.length){ showToast('Nada para exportar (verifique o filtro de busca).', 'warn'); return; }
  const header = ['Unidade','Empreendimento','Cliente','Valor','Status','Sub-fase','Dias'];
  const data = rows.map(tr=>{
    const c = findCase(Number(tr.getAttribute('data-caseid')));
    return [c.unidade, c.empreendimento, c.cliente, c.valor, (MACRO_META[c.macro]&&MACRO_META[c.macro].label)||c.macro, c.subFase||'', c.dias];
  });
  const csv = [header, ...data].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'esteira_'+tid+'_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click(); URL.revokeObjectURL(url);
}

function nextTarefaInfo(c){
  // próximo compromisso = tarefa pendente mais próxima OU agendamento de Recompras, o que vier antes
  const pend = (c.tarefas||[]).filter(t=>!t.concluida).map(t=>({tipo:t.tipo, data:t.data, hora:t.hora||''}));
  if(c.macro==='recompras' && c.agendamentoData) pend.push({tipo:'Agendamento', data:c.agendamentoData, hora:c.agendamentoHora||''});
  if(!pend.length) return null;
  const t = pend.sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora))[0];
  const hoje = new Date().toISOString().split('T')[0];
  const diff = Math.round((new Date(t.data+'T00:00:00') - new Date(hoje+'T00:00:00'))/86400000);
  const rel = diff===0 ? 'hoje' : (diff>0 ? `+${diff}d` : `${diff}d`);
  return {tipo:t.tipo, rel, atrasada: diff<0};
}
function renderTarefaCell(c){
  const info = nextTarefaInfo(c);
  if(!info) return `<span class="sub">—</span>`;
  return `<div class="nexttask ${info.atrasada?'late':''}"><div class="nt-tipo">${esc(info.tipo)}</div><div class="nt-rel">${info.rel}</div></div>`;
}
function renderRow(c){
  const late = c.dias >= 8;
  const a = renderActions(c);
  // Status: quando a etapa tem fases, o próprio seletor vive aqui (muda direto na coluna);
  // senão, mostra o badge da etapa. O badge de macro sai quando há seletor — menos ruído.
  const statusCell = a.select ? a.select : badge(c.macro);
  return `<tr data-caseid="${c.id}" data-search="${searchAttr(c)}" data-subfase="${esc(c.subFase||'')}">
    <td><div class="unid" onclick="openDetailModal(${c.id})">${c.unidade}</div><div class="sub">${c.empreendimento} · ${fmtMoney(c.valor)}</div></td>
    <td>${c.cliente}${c.vendedor?`<div class="sub">Vendedor: ${c.vendedor}</div>`:''}${c.analista?`<div class="sub">Analista: ${c.analista}</div>`:''}</td>
    <td>${bracoLabel(c.braco)}</td>
    <td>${statusCell}</td>
    <td><span class="dias ${late?'late':''}">${c.dias}d</span></td>
    <td>${renderTarefaCell(c)}</td>
    <td><button class="detailbtn" onclick="openDetailModal(${c.id})">🔍 Ver detalhes</button></td>
    <td>${renderActionsCell(c, a)}</td>
  </tr>`;
}

const RELAC_FASE_INICIAL = '— Aguardando 1º contato';
const RELAC_FASES = [RELAC_FASE_INICIAL, 'TENTANDO CONTATO','CONVERSANDO'];
const RECOMPRAS_FASES = ['EM CONTATO','PRÉ-AGENDAMENTO','AGENDADO'];
function subFaseSelect(c, catalog){

// renderActions/renderFaseActions retornam {select, primary, secondary:[{label,onclick,danger}]}
// — a ação principal fica visível na linha, as secundárias (recusa, sem contato, reprovar...) vão pro menu "⋯"
function renderActions(c){
  switch(c.macro){
    case 'relacionamento':

    case 'viabilidade':

        secondary:[{label:'Reprovar', onclick:`openObsModal(${c.id}, 'credito_reprova')`, danger:true}],
      };
    case 'repasse':
      return renderFaseActions(c);

// Monta a célula de ações: seletor de fase + botão principal sempre visíveis; o resto (ações
// secundárias/perigosas + "Cliente pagou CEF") entra num menu "⋯" — evita a fileira de botões
// quebrando linha que deixava a tabela poluída.
function renderActionsCell(c, a){
  a = a || renderActions(c);
  const canCef = !['concluido','encerrado','resolvido_cef','distratado','cancelado_adm'].includes(c.macro);
  const secondary = [...a.secondary];

function toggleRowMenu(ev, id){
  ev.stopPropagation();

  const wasOpen = menu.classList.contains('show');

function cancelAddRegistro(caseId){
  if(addRegistroCameFromPanel){ detailTab='atividades'; renderDetailModal(caseId); }
  else closeModal();
}
async function confirmAddRegistro(caseId){
  const c = findCase(caseId);
  const tipo = g('regTipo').value;
  const autor = CURRENT_USER.nome;
  const texto = g('regTexto').value;
  const hoje = new Date().toISOString().split('T')[0];
  const dataEl = g('regData');
  const data = dataEl ? dataEl.value : hoje;
  const hora = g('regHora') ? g('regHora').value : '';
  if(data < hoje){ showToast('Não é possível registrar uma data no passado.', 'warn'); return; }

  const fileInput = g('regAnexos');
  const btn = g('regConfirmBtn');
  if(btn){ btn.disabled = true; btn.textContent = fileInput && fileInput.files.length ? 'Enviando anexos…' : 'Adicionando…'; }
  const anexos = await processAnexos(caseId, fileInput ? fileInput.files : null);
  if(anexos === null){ if(btn){ btn.disabled = false; btn.textContent = 'Adicionar'; } return; } // excedeu limite, já avisou

  if(data > hoje){
    // Data futura: vira tarefa em vez de entrada de histórico imediata
    if(!c.tarefas) c.tarefas = [];
    const newId = c.tarefas.reduce((m,t)=>Math.max(m,t.id),0)+1;
    c.tarefas.push({id:newId, tipo, data, hora, obs:texto, concluida:false, anexos: anexos.length?anexos:undefined});
    logHistory(c, `Tarefa agendada: ${tipo} em ${data}${hora?' '+hora:''}`, texto);
    showToast('Data futura — registro adicionado como tarefa.', 'ok');
  } else {
    c.history.push({date: nowStr(), evento: `Registro: ${tipo}`, por: autor, obs: texto || undefined, manual:true, anexos: anexos.length?anexos:undefined});
  }
  saveDB();
  if(addRegistroCameFromPanel){ detailTab = 'atividades'; renderDetailModal(caseId); }
  else closeModal();
  render();
}
// Anexos: sobem pro Storage do Supabase quando online; offline (ou sem bucket configurado ainda)
// caem pra data URI local, guardada só no cache do navegador — nunca se perde o clique, mas
// avisa quando não sincronizou de verdade pra nuvem.
const ANEXOS_BUCKET = 'anexos';
const ANEXOS_MAX_TOTAL = 8 * 1024 * 1024; // 8MB por registro
function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function processAnexos(caseId, fileList){
  const files = Array.from(fileList||[]);
  if(!files.length) return [];
  const total = files.reduce((s,f)=>s+f.size,0);
  if(total > ANEXOS_MAX_TOTAL){
    showToast('Anexos somam mais de 8MB — remova algum arquivo antes de adicionar.', 'warn');
    return null;
  }
  const out = [];
  let algumLocal = false;
  for(const f of files){
    let subiu = false;
    if(supa && supabaseOnline){
      try{
        const path = `${caseId}/${Date.now()}-${f.name}`.replace(/\s+/g,'_');
        const {error} = await supa.storage.from(ANEXOS_BUCKET).upload(path, f, {upsert:false});
        if(error) throw error;
        const {data} = supa.storage.from(ANEXOS_BUCKET).getPublicUrl(path);
        out.push({name:f.name, url:data.publicUrl, type:f.type, size:f.size});
        subiu = true;
      }catch(e){
        console.warn('Falha ao subir anexo pro Supabase — salvando só localmente', e);
      }
    }
    if(!subiu){
      out.push({name:f.name, url: await fileToDataUrl(f), type:f.type, size:f.size, local:true});
      algumLocal = true;
    }
  }
  if(algumLocal) showToast('Anexo salvo só neste navegador — Supabase Storage indisponível ou bucket "anexos" não configurado ainda.', 'warn');
  return out;
}
function renderAnexosChips(anexos){

// ───────────────────────── Cálculo de viabilidade (interno — substitui o Motor externo) ─────────────────────────
// Antes: abria motor-de-viabilidade.html numa aba separada, buscando dados de outra planilha (Google Sheets),
// e voltava pro CRM via localStorage. Agora: mesma conta (16 itens, waterfall receita − custos), calculada aqui
// dentro, pré-preenchida com o que já se sabe da unidade (venda + custas reais já embutidas no app).
function round2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }
function calcItbiRevenda(v){
  if(v >= 245527.77) return (v - 120968) * 0.03 + 120968 * 0.005;
  return 0;
}
// Tabela de emolumentos (registro da escritura fiduciária) por faixa de valor — TJ/SP.
// PROCX(valor; faixas; emolumentos; ; 1) = correspondência exata ou a PRÓXIMA FAIXA MAIOR.
const EMOLUMENTO_FIDUCIARIA_TABELA = [
  {limite:2306.00,    valor:260.39},  {limite:5761.00,    valor:417.83},
  {limite:9603.00,    valor:749.59},  {limite:19210.00,   valor:1112.17},
  {limite:38420.00,   valor:1352.14}, {limite:115260.00,  valor:1507.90},
  {limite:192100.00,  valor:1924.63}, {limite:230520.00,  valor:2340.51},
  {limite:268940.00,  valor:2548.04}, {limite:307360.00,  valor:2756.74},
  {limite:345780.00,  valor:2906.16}, {limite:384200.00,  valor:2981.91},
  {limite:768400.00,  valor:3324.85}, {limite:1152600.00, valor:3893.73},
  {limite:1536800.00, valor:4482.62}, {limite:1921000.00, valor:5071.57},
  {limite:2305200.00, valor:5376.06}, {limite:3842000.00, valor:6898.44},
  {limite:5763000.00, valor:9638.72}, {limite:7684000.00, valor:12683.48},
  {limite:9605000.00, valor:15728.24},{limite:11526000.00,valor:18773.00},
];
function lookupEmolumentoFiduciario(valor){
  for(const row of EMOLUMENTO_FIDUCIARIA_TABELA){ if(valor <= row.limite) return row.valor; }
  // acima do teto da tabela (nenhuma faixa maior) — usa o último valor conhecido
  return EMOLUMENTO_FIDUCIARIA_TABELA[EMOLUMENTO_FIDUCIARIA_TABELA.length-1].valor;
}
// = PROCX(valor;...) + PROCX(valor×80%;...) — duas taxas de registro (imóvel + garantia fiduciária)
function calcEmolumentoFiduciariaRevenda(valorVenda){
  return round2(lookupEmolumentoFiduciario(valorVenda) + lookupEmolumentoFiduciario(valorVenda*0.8));
}
// = (metragem × R$15) × (meses restantes até o habite-se) — projeção de cotas condominiais até a entrega.
// Precisa da área (m²) da unidade, que não vem da base — por isso é um campo digitado à parte (c.metragemM2).
function calcCondominioAteEntrega(c){
  const key = (c.empreendimento||'').trim().toUpperCase();
  const dataHabite = HABITE_SE_NORM[key];
  const metragem = c.metragemM2 || 0;
  if(!dataHabite || !metragem) return 0;
  const meses = (new Date(dataHabite+'T00:00:00') - new Date()) / 86400000 / 30;
  return meses > 0 ? round2(metragem * 15 * meses) : 0;
}
const VIAB_ITEMS = [
  {id:1,  desc:'Recebimento previsto pelo novo comprador / CEF',                      sinal:1,  tipo:'venda',       abrev:'Recebimento\nprevisto'},
  {id:2,  desc:'RET — Regime Especial de Tributação (4% da receita)',                 sinal:-1, tipo:'calc', base:1, pct:4, abrev:'RET\n(receita)'},

// Campos que precisam estar confirmados (mesmo que o valor seja R$0) antes da unidade seguir pra Vendas.
const VIAB_REQUIRED_IDS = VIAB_ITEMS.filter(it=>it.obrigatorio).map(it=>it.id);
function viabCamposFaltando(c){
  const ov = c.viabOverrides || {};
  return VIAB_REQUIRED_IDS.filter(id => ov[id]===undefined).map(id => VIAB_ITEMS.find(it=>it.id===id).desc);
}
function viabValorVenda(c){
  return (c.financeiro && c.financeiro.vendaNova && c.financeiro.vendaNova.valorNegociado) || c.valor || 0;
}
function buildViabilidadeValues(c){
  // As duas planilhas coexistem por chave: CUSTAS_PROJ tem os campos projetados da venda nova
  // (laudo/condomínio/remuneração), CUSTAS_PAGAS tem o que já foi realmente pago/apurado (ex:
  // quitação CEF). Pegar só um objeto inteiro (ex: só CUSTAS_PROJ por existir a chave) zerava
  // campos que só estão preenchidos no outro — por isso o fallback é CAMPO A CAMPO, não por objeto.
  const custasProj = getCustasProj(c) || {};
  const custasPagas = getCustasPagas(c) || {};
  const custaField = field => custasProj[field] || custasPagas[field] || 0;
  const valorVenda = viabValorVenda(c);
  const overrides = c.viabOverrides || {};
  const values = {};
  VIAB_ITEMS.forEach(it=>{
    if(overrides[it.id] !== undefined){ values[it.id] = overrides[it.id]; return; }
    let v = 0;
    if(it.tipo==='venda') v = valorVenda;
    else if(it.tipo==='calc') v = Math.abs(values[it.base]||0) * (it.pct/100);
    else if(it.tipo==='custafield') v = custaField(it.field);
    else if(it.tipo==='fixo') v = it.fixo;
    else if(it.tipo==='itbiRevenda') v = calcItbiRevenda(valorVenda);
    else if(it.tipo==='emolFiduciariaRevenda') v = calcEmolumentoFiduciariaRevenda(valorVenda);
    else if(it.tipo==='condominio') v = calcCondominioAteEntrega(c);
    values[it.id] = round2(v);
  });
  return values;
}
function totalViabilidade(values){
  return round2(VIAB_ITEMS.reduce((s,it)=>s + (it.sinal===1?values[it.id]:-values[it.id]), 0));
}
// Classificação padrão de viabilidade (rótulos e limiares em UM lugar só — usada no
// badge da ficha, no PDF individual, na capa e na análise em lote).
function viabClassificacao(total){
  const cfg = VIAB_CONFIG;
  if(total < cfg.thMin) return {key:'inviavel', icon:'✗', label:'Inviável', desc:`Lucro abaixo de ${fmtMoney(cfg.thMin)}`, cls:'warn'};
  if(total < cfg.thAlert) return {key:'atencao', icon:'⚠', label:'Atenção', desc:`Entre ${fmtMoney(cfg.thMin)} e ${fmtMoney(cfg.thAlert)}`, cls:'warn'};
  return {key:'aprovado', icon:'✓', label:'Pré aprovado', desc:`Lucro acima de ${fmtMoney(cfg.thAlert)}`, cls:'ok'};
}

      <tbody>${rows}</tbody>
    </table></div>
    <div class="result-block" style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:9px;padding:12px 16px;margin-top:10px">

function updateViabItem(caseId, itemId, rawVal){
  const c = findCase(caseId);
  const item = VIAB_ITEMS.find(it=>it.id===itemId);

  const num = round2(parseFloat(String(rawVal).replace(/\./g,'').replace(',','.')) || 0);
  if(!c.viabOverrides) c.viabOverrides = {};
  c.viabOverrides[itemId] = num;
  if(num !== before){
    logHistory(c, `Viabilidade — "${item ? item.desc : 'item '+itemId}" ajustado manualmente: ${fmtMoney(before)} → ${fmtMoney(num)}`, null);
  }
  saveDB();
  detailTab = 'financeiro';
  renderDetailModalPreservingScroll(caseId);
}

// Tabela de cadastro de custas — mostra as 10 categorias fixas da planilha oficial (CUSTA_LABELS),
// já vindas prontas (planilha embutida) ou cadastradas na mão (c.custasPagasOverride/custasProjOverride).
// "grupo" é 'pagas' (passado, já ocorreu) ou 'proj' (futuro, projetado) — decide qual override mexe.
function custasCadastroTable(titulo, c, grupo, editavel){
  const valores = grupo==='pagas' ? getCustasPagas(c)||{} : getCustasProj(c)||{};
  const overrideObj = grupo==='pagas' ? (c.custasPagasOverride||{}) : (c.custasProjOverride||{});
  const rows = Object.keys(CUSTA_LABELS).map(field=>{
    const val = valores[field] || 0;
    const overridden = overrideObj[field] !== undefined;
    const tag = overridden ? ' <span class="sub" style="font-size:10px;color:var(--info)">(cadastrado)</span>' : '';
    return `<tr>
      <td style="font-size:12px">${esc(CUSTA_LABELS[field])}${tag}</td>
      <td style="text-align:right;width:130px">${editavel
        ? `<input type="text" value="${fmtMoney(val).replace('R$ ','')}" onchange="updateCustaCadastro(${c.id}, '${grupo}', '${field}', this.value)" style="width:100%;text-align:right;font-size:12.5px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)">`
        : fmtMoney(val)}</td>
    </tr>`;
  }).join('');
  const total = Object.keys(CUSTA_LABELS).reduce((s,field)=>s+(valores[field]||0),0);
  return `<div class="sectiontitle" style="margin:10px 0 8px">${titulo}</div><div class="tablewrap"><table class="parctable">
    <thead><tr><th>Item</th><th style="text-align:right">Valor</th></tr></thead>
    <tbody>${rows}<tr style="font-weight:700"><td>Total</td><td style="text-align:right">${fmtMoney(total)}</td></tr></tbody>
  </table></div>`;
}

function updateCustaCadastro(caseId, grupo, field, rawVal){
  const c = findCase(caseId);
  const key = grupo==='pagas' ? 'custasPagasOverride' : 'custasProjOverride';
  const label = grupo==='pagas' ? 'Custas passadas' : 'Custas futuras';
  const before = (grupo==='pagas' ? getCustasPagas(c) : getCustasProj(c)) || {};
  const beforeVal = before[field] || 0;
  const num = round2(parseFloat(String(rawVal).replace(/\./g,'').replace(',','.')) || 0);
  if(!c[key]) c[key] = {};
  c[key][field] = num;
  if(num !== beforeVal){
    logHistory(c, `${label} — "${CUSTA_LABELS[field]}" cadastrado/ajustado: ${fmtMoney(beforeVal)} → ${fmtMoney(num)}`, null);
  }
  c.financeiro = mockFinanceiro(c);
  saveDB();
  detailTab = 'financeiro';
  renderDetailModalPreservingScroll(caseId);
}

// ⚠️ FONTE DA VERDADE DO FLUXO — o switch abaixo (e as outras transições de macro espalhadas pelo
// arquivo: openViabilidadeModal, confirmAddUnidade, etc.) é o que decide de fato pra onde cada caso
// vai. Toda vez que uma etapa, decisão ou saída de exceção mudar aqui, o desenho em renderFluxograma()
// fica desatualizado — ele é hand-drawn, não gerado a partir do código. Atualize os dois juntos.
async function confirmObsAction(id, action){
  const c = findCase(id);
  const motivoEl = g('obsMotivo');
  if(motivoEl && !motivoEl.value){ showToast('Selecione um motivo antes de confirmar.', 'warn'); return; }
  const motivo = motivoEl ? (motivoEl.value==='__outro' ? null : motivoEl.value) : null;
  const obsTextRaw = g('obsText') ? g('obsText').value : '';
  const obsText = motivo ? (obsTextRaw ? `${motivo} — ${obsTextRaw}` : motivo) : obsTextRaw;
  if(motivo) c.motivoEncerramento = motivo;
  // Trava a saída pra Vendas até a Quitação CEF / Reparos / Restituição estarem confirmados
  // (aba Financeiro → Cálculo de viabilidade) — mesmo que o valor real seja R$0.
  if(action==='procuracao' || action==='aprova_recompra_vencida'){
    const faltando = viabCamposFaltando(c);
    if(faltando.length){
      closeModal();
      showToast(`Preencha antes de liberar pra Vendas (Financeiro → Cálculo de viabilidade): ${faltando.join('; ')}.`, 'warn');
      return;
    }
  }
  // Aprovação Comercial precisa de uma aprovação anexada. Se ainda não tem nenhuma, a caixa de
  // anexo já apareceu no próprio modal (openObsModal) — sobe o arquivo aqui e já segue o fluxo,
  // sem exigir um passo separado de "gerar PDF" antes. Se já tem, só confirma com o "OK" marcado.
  let anexosDaAprovacao = null;
  if(action==='aprovacao_comercial'){
    const temPdf = (c.docsExtras||[]).some(d=>d.startsWith('Viabilidade —')||d.startsWith('Aprovação Comercial —'));
    if(!temPdf){
      const fileInput = g('aprovAnexo');
      const file = fileInput && fileInput.files[0];
      if(!file){ showToast('Anexe o PDF/imagem da aprovação antes de confirmar.', 'warn'); return; }
      const btn = g('obsConfirmBtn');
      if(btn){ btn.disabled = true; btn.textContent = 'Enviando anexo…'; }
      const anexos = await processAnexos(c.id, fileInput.files);
      if(anexos === null){ if(btn){ btn.disabled=false; btn.textContent='Confirmar'; } return; }
      anexosDaAprovacao = anexos;
      if(!c.docsExtras) c.docsExtras = [];
      c.docsExtras.push(`Aprovação Comercial — ${c.unidade} (${nowStr().split(' ')[0]}).pdf`);
    } else {
      const ok = g('okPdfAnexado');
      if(!ok || !ok.checked){
        showToast('Marque "OK, PDF anexado" antes de confirmar.', 'warn');
        return;
      }
    }
  }
  logHistory(c, ACTION_EVENTS[action]||action, obsText, anexosDaAprovacao);
  c.dias = 0;
  switch(action){
    case 'interesse': c.macro='recompras'; c.subFase='EM CONTATO'; break;
    case 'recusa': case 'recusa_seguir': case 'sem_contato': c.macro='encerrado'; c.subFase=undefined; break;
    case 'procuracao':
      c.macro='vendas_livre'; c.subFase=undefined; c.procuracaoVencida=false;
      c.procuracaoVencimento = addDias(new Date().toISOString().split('T')[0], PROC_CONFIG.validadeDias);
      break;
    // Procuração venceu sem comprador — a Retomada aprova a recompra de verdade (deixa de ser
    // Transferência Assistida, braco='recompra') e a unidade já sai direto pra Distratos, pro
    // time liberar pro estoque geral (não é o mesmo estoque/fluxo da recompra à vista que sai
    // da Aprovação Comercial — daqui em diante segue igual: Distratos → Contratos → Concluído).
    case 'aprova_recompra_vencida':
      c.macro='distratos'; c.braco='recompra'; c.subFase=undefined; c.procuracaoVencida=false;
      break;
    // Quem registra o interesse "assume" o negócio — some do pool geral e passa a aparecer
    // só na aba "Vendas" (pessoal) dessa pessoa, não mais em "Disponíveis para Negociação".
    case 'registrar_interesse': c.macro='viabilidade'; c.interesseEm=Date.now(); c.vendedor=CURRENT_USER.nome; break;
    // A forma de pagamento foi escolhida na hora de gerar o PDF de viabilidade (c.viabForma).
    // À vista = a Transferência Assistida virou recompra: volta pra esteira de Recompras pra
    // executar a recompra de verdade (não é mais a procuração original — braco='recompra' sinaliza isso).
    case 'aprovacao_comercial':
      if(c.viabForma==='avista'){ c.macro='recompras'; c.braco='recompra'; c.subFase='EM CONTATO'; }
      else { c.macro='credito'; c.braco='cessao'; }
      break;
    case 'recompra_concluida': c.macro='distratos'; c.subFase=undefined; break;
    case 'credito_aprova': c.macro='repasse'; c.subFase='NEGOCIAÇÃO'; c.minutaGerada=false; break;
    case 'credito_reprova': c.macro='vendas_livre'; c.braco=null; break;
    case 'cessao_uau': c.macro='concluido'; c.subFase=undefined; break;
    case 'liberar_unidade': c.macro='contratos_recompra'; break;
    case 'recompra_uau': c.macro='concluido'; break;
    case 'assinatura_presencial': c.macro='contratos_cessao'; break;
  }
  c.documentos = mockDocumentos(c);
  c.financeiro = mockFinanceiro(c);
  saveDB(); closeModal(); render();
}

// Cálculo de viabilidade — a mesma conta da aba Financeiro (renderCustasViabilidade), aqui no fluxo de

  const c = findCase(id);

  // Cessão (Transferência Assistida) só vale dentro dos 180 dias do Habite-se — fora do prazo, só recompra.
  // TRAVA DESLIGADA TEMPORARIAMENTE (pedido do Pedro, p/ simulação) — reativar trocando a linha abaixo por:
  // const dentroDoPrazo = eleg.diasRestantes===null || eleg.diasRestantes>=0;
  const dentroDoPrazo = true;
  const forma = dentroDoPrazo ? (c.viabForma || 'financiado') : 'avista';
  const avisoPrazo = !dentroDoPrazo
    ? `<div class="warn-flag" style="margin:2px 0 12px">⚠ Unidade fora do prazo dos 180 dias do Habite-se (venceu há ${Math.abs(eleg.diasRestantes)} dias) — só é permitida <b>Recompra à vista</b>. Cessão (Transferência Assistida) exige estar dentro do prazo.</div>`
    : '';
  g('modalBox').className = 'modal wide';
  g('modalBox').innerHTML = `
    <h3>Cálculo de viabilidade</h3>
    <p><b>${c.unidade}</b> · ${c.empreendimento} · ${c.cliente}${eleg.habiteSe?` · Habite-se: ${eleg.habiteSe}`:''}</p>

    <label>Forma de pagamento</label>
    <div class="viewtoggle" id="viabFormaToggle" style="display:inline-flex;margin:2px 0 12px">
      <button class="vtbtn ${forma==='avista'?'active':''}" data-forma="avista" onclick="selViabForma(this)">💰 À vista (recompra)</button>
      <button class="vtbtn ${forma==='financiado'?'active':''}" data-forma="financiado" onclick="selViabForma(this)" ${dentroDoPrazo?'':'disabled title="Fora do prazo dos 180 dias — só recompra à vista"'}>🏦 Financiado (cessão)</button>
    </div>
    ${renderCustasViabilidade(c)}
    <label>Observação (opcional)</label>
    <textarea id="obsText" rows="3" placeholder="Ex: Viabilidade calculada, financiamento Caixa 80%."></textarea>
    <div class="btnrow"><button class="act ghost" onclick="closeModal()">Cancelar</button><button class="act primary" onclick="gerarPdfViabilidade(${id})">📄 Gerar PDF</button></div>
  `;
  g('modalOverlay').classList.add('show');
}

function gerarPdfViabilidade(id){
  const c = findCase(id);
  const eleg = calcElegibilidade(c);
  // TRAVA DESLIGADA TEMPORARIAMENTE (mesmo motivo do openViabilidadeModal) — reativar com:
  // const dentroDoPrazo = eleg.diasRestantes===null || eleg.diasRestantes>=0;
  const dentroDoPrazo = true;
  let forma = getViabFormaSel();
  if(!dentroDoPrazo && forma==='financiado'){
    forma = 'avista';
    showToast('Unidade fora do prazo dos 180 dias — forçado para Recompra à vista.', 'warn');
  }
  const obsText = g('obsText') ? g('obsText').value : '';
  const values = buildViabilidadeValues(c);
  const total = totalViabilidade(values);
  const clasPdf = viabClassificacao(total);
  const statusTxt = `${clasPdf.icon} ${clasPdf.label.toUpperCase()}`;
  const agora = nowStr();

  // 1) Relatório imprimível — o "Salvar como PDF" do navegador gera o arquivo real
  const linhas = VIAB_ITEMS.map(it=>`<tr>
      <td>${it.sinal===1?'(+)':'(−)'} ${esc(it.desc)}</td>
      <td style="text-align:right">${fmtMoney(values[it.id])}</td>
    </tr>`).join('');
  const pdfHtml = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Viabilidade ${esc(c.unidade)}</title>
    <style>
      body{font-family:'Segoe UI',Arial,sans-serif;color:#201d1a;margin:36px;font-size:13px}
      h1{font-size:18px;margin:0 0 2px;color:#e2231a} .sub{color:#6b6459;font-size:12px;margin-bottom:18px}
      table{width:100%;border-collapse:collapse;margin-top:10px}
      th{text-align:left;font-size:11px;color:#6b6459;text-transform:uppercase;border-bottom:2px solid #e2231a;padding:6px 8px}
      td{padding:6px 8px;border-bottom:1px solid #e6e2dc}
      .total td{font-weight:700;font-size:15px;border-top:2px solid #201d1a;border-bottom:none}
      .status{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:6px;font-weight:700;background:${clasPdf.key==='inviavel'?'#f7e9d4':'#e1f0e4'};color:${clasPdf.key==='inviavel'?'#b5651d':'#3b7a4c'}}
      .meta{margin-top:22px;font-size:11px;color:#9c948a}
    </style></head><body>
    <h1>Metrocasa — Cálculo de Viabilidade</h1>
    <div class="sub">${esc(c.unidade)} · ${esc(c.empreendimento)} · ${esc(c.cliente)} · Forma: <b>${forma==='avista'?'À vista (recompra)':'Financiado (cessão)'}</b></div>
    <table><thead><tr><th>Item</th><th style="text-align:right">Valor</th></tr></thead>
      <tbody>${linhas}<tr class="total"><td>Resultado</td><td style="text-align:right">${fmtMoney(total)}</td></tr></tbody></table>
    <div class="status">${statusTxt}</div>
    ${obsText?`<p style="margin-top:14px"><b>Observação:</b> ${esc(obsText)}</p>`:''}
    <div class="meta">Gerado em ${agora} por ${esc(CURRENT_USER.nome)} · Transferência Assistida</div>
    <script>window.print()<\/script></body></html>`;
  try{
    const w = window.open('', '_blank');
    if(w){ w.document.write(pdfHtml); w.document.close(); }
    else showToast('Janela de impressão bloqueada pelo navegador — o caso avançou mesmo assim.', 'warn');
  }catch(e){
    showToast('Não consegui abrir a janela de impressão — o caso avançou mesmo assim.', 'warn');
  }

  // 2) Registra o PDF como documento do caso (sobrevive às transições via docsExtras)
  const docName = `Viabilidade — ${c.unidade} (${agora.split(' ')[0]}).pdf`;
  if(!c.docsExtras) c.docsExtras = [];
  if(!c.docsExtras.includes(docName)) c.docsExtras.push(docName);

  // 3) Anexa o resultado e move pra Aguardando Aprovação Comercial
  c.viabForma = forma;
  c.dias = 0;
  c.macro = 'aprovacao_comercial';
  c.financeiro = mockFinanceiro(c);
  c.financeiro.custasProjetadas = VIAB_ITEMS.filter(it=>it.sinal===-1).map(it=>({item:it.desc, valor:values[it.id]}));
  c.financeiro.viabilidade = { status:'em análise', resultado: total, dataAprovacao: null };
  c.documentos = mockDocumentos(c);
  logHistory(c, `PDF de viabilidade gerado — ${forma==='avista'?'À vista (recompra)':'Financiado (cessão)'} · Resultado: ${fmtMoney(total)} (${statusTxt})`, obsText);
  saveDB(); closeModal(); render();
  showToast('PDF gerado e anexado — caso aguardando Aprovação Comercial.', 'ok');
}

function openSinalizarDistratoModal(id){
  const c = findCase(id);
  g('modalBox').className = 'modal';
  g('modalBox').innerHTML = `
    <h3>Comunicar risco de distrato</h3>
    <p><b>${c.unidade}</b> · ${c.empreendimento} · ${c.cliente}</p>
    <div class="warn-flag" style="background:var(--info-soft);color:var(--info)">ℹ Você não altera mais a etapa desta venda. Isto apenas avisa o Relacionamento, que vai confirmar diretamente com o cliente se ele realmente quer distratar e por qual motivo.</div>
    <label>Por que o cliente pode desistir?</label>
    <textarea id="obsText" rows="3" placeholder="Ex: Cliente comentou que encontrou outra unidade mais barata."></textarea>
    <div class="btnrow"><button class="act ghost" onclick="closeModal()">Cancelar</button><button class="act danger" onclick="confirmSinalizarDistrato(${id})">Comunicar ao Relacionamento</button></div>
  `;
  g('modalOverlay').classList.add('show');
}
function confirmSinalizarDistrato(id){
  const c = findCase(id);
  const motivo = g('obsText').value || 'Sem motivo informado.';
  ALERTS.push({id: nextAlertId(), caseId:id, tipo:'sinalizacao_vendas', motivo, criadoEm: nowStr(), destino:['relacionamento'], resolvido:false});
  logHistory(c, 'Vendas comunicou risco de distrato — aguardando confirmação do Relacionamento com o cliente', motivo);
  saveDB(); closeModal(); render();
}

function openConfirmDistratoModal(alertId){
  const a = ALERTS.find(x=>x.id===alertId);
  const c = findCase(a.caseId);
  g('modalBox').className = 'modal warn-modal';
  g('modalBox').innerHTML = `
    <h3>⚠ Confirmar distrato com o cliente</h3>
    <p><b>${c.unidade}</b> · ${c.empreendimento} · ${c.cliente}</p>
    <div class="warn-flag">⚠ Confirme apenas depois de falar com o cliente. Isso cancela a etapa atual (${MACRO_META[c.macro].label}), avisa a equipe que estava trabalhando no caso e a Administração, e devolve a unidade ao estoque.</div>
    <label>Motivo confirmado com o cliente</label>
    <textarea id="obsText" rows="3" placeholder="Ex: Confirmado por telefone em 03/08 — cliente desistiu por motivos financeiros.">${esc(a.motivo)}</textarea>
    <div class="btnrow"><button class="act ghost" onclick="closeModal()">Cancelar</button><button class="act danger" onclick="confirmDistrato(${alertId})">Confirmar distrato</button></div>
  `;
  g('modalOverlay').classList.add('show');
}
function confirmDistrato(alertId){
  const a = ALERTS.find(x=>x.id===alertId);
  const c = findCase(a.caseId);
  const motivo = g('obsText').value || a.motivo;
  const prevMacro = c.macro;
  const prevLabel = MACRO_META[prevMacro].label;
  a.resolvido = true;

  logHistory(c, `Distrato confirmado pelo Relacionamento — etapa cancelada (estava em: ${prevLabel})`, motivo);
  c.macro = 'distratado';
  c.subFase = undefined;

  const targets = macroToRoles(prevMacro).concat(['admin']);
  targets.forEach(role=>{
    ALERTS.push({id: nextAlertId(), caseId:c.id, tipo:'distrato_confirmado', motivo, criadoEm: nowStr(), destino:[role], resolvido:false});
  });

  saveDB(); closeModal(); render();
}

// ───────────────────────── Adicionar unidade (catálogo real da planilha) ─────────────────────────
function empreendimentosCatalogo(){
  // Lista completa de empreendimentos (não só os que já têm unidade em negociação)
  return [...ALL_EMPREENDIMENTOS].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function unidadesDoEmpreendimento(emp){
  return UNIT_CATALOG.filter(u=>u.emp===emp);
}
function openAddUnidadeModal(){
  const emps = empreendimentosCatalogo();
  const empOptions = emps.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('');
  g('modalBox').className = 'modal';
  g('modalBox').innerHTML = `
    <h3>➕ Adicionar unidade à esteira</h3>
    <p>Cadastro inicial — agnóstico de Cessão ou Recompra, conforme o fluxo. Empreendimento vem da lista completa; unidade vem do catálogo de unidades já em negociação quando existir, ou é digitada manualmente.</p>
    <label>Empreendimento</label>
    <select id="addEmp" onchange="onAddUnidadeEmpChange()">
      <option value="">— selecione —</option>
      ${empOptions}
    </select>
    <div id="addUnidadeWrap">
      <label>Unidade</label>
      <select id="addUnidadeSelect" disabled><option value="">— selecione o empreendimento primeiro —</option></select>
    </div>
    <label>Cliente responsável atual</label>
    <input type="text" id="addCliente" placeholder="Nome completo do cliente">
    <label>Valor da venda (R$)</label>
    <input type="text" id="addValor" placeholder="Ex: 312000">
    <label>Observação (opcional)</label>
    <textarea id="obsText" rows="2" placeholder="Ex: Cadastro feito a partir de contato da central."></textarea>
    <div class="btnrow"><button class="act ghost" onclick="closeModal()">Cancelar</button><button class="act primary" onclick="confirmAddUnidade()">Adicionar à esteira</button></div>
  `;
  g('modalOverlay').classList.add('show');
}
function onAddUnidadeEmpChange(){
  const emp = g('addEmp').value;
  const wrap = g('addUnidadeWrap');
  if(!emp){
    wrap.innerHTML = `<label>Unidade</label><select id="addUnidadeSelect" disabled><option value="">— selecione o empreendimento primeiro —</option></select>`;
    return;
  }
  const units = unidadesDoEmpreendimento(emp);
  if(units.length){
    wrap.innerHTML = `<label>Unidade</label>
      <select id="addUnidadeSelect">
        <option value="">— selecione —</option>
        ${units.map(u=>`<option value="${esc(u.chave)}">${esc(u.bloco)}-${esc(u.unidade)}</option>`).join('')}
      </select>`;
  } else {
    // Empreendimento sem unidade ainda na base de negociação — permite digitar manualmente
    wrap.innerHTML = `<label>Unidade <span class="sub">— empreendimento ainda sem unidade na base de negociação; digite bloco e número</span></label>
      <input type="text" id="addUnidadeManual" placeholder="Ex: U-0210">`;
  }
}
function confirmAddUnidade(){
  const emp = g('addEmp').value;
  const selEl = g('addUnidadeSelect');
  const manualEl = g('addUnidadeManual');
  const chave = selEl ? selEl.value : '';
  const manual = manualEl ? manualEl.value.trim() : '';
  const cliente = g('addCliente').value.trim();
  const valor = parseFloat((g('addValor').value||'0').replace(/[^\d,.-]/g,'').replace(',','.')) || 0;
  const obsText = g('obsText').value;
  if(!emp || (!chave && !manual) || !cliente){ showToast('Preencha empreendimento, unidade e cliente.', 'warn'); return; }

  const catalogEntry = chave ? UNIT_CATALOG.find(u=>u.chave===chave) : null;
  const newId = DB.reduce((m,c)=>Math.max(m,c.id),0) + 1;
  const novoCaso = {
    id: newId,
    unidade: catalogEntry ? `${catalogEntry.bloco}-${catalogEntry.unidade}` : (manual || '—'),
    empreendimento: emp,
    cliente,
    valor,
    macro: 'relacionamento',
    subFase: RELAC_FASE_INICIAL,
    braco: null,
    dias: 0,
    analista: null,
    chave: chave || null,
    tarefas: [],
    history: [{date: nowStr(), evento:'Caso cadastrado na esteira', por:'Você', obs: obsText||undefined}],
  };
  novoCaso.financeiro = mockFinanceiro(novoCaso);
  novoCaso.documentos = mockDocumentos(novoCaso);
  DB.push(novoCaso);
  saveDB();
  closeModal();
  setView('relacionamento_gestor');
  showToast(`Unidade ${novoCaso.unidade} adicionada à esteira.`, 'ok');
}

document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id==='modalOverlay') closeModal();
});

initAuth();
</script>
