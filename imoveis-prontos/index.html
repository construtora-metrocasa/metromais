// Tabela de cadastro de custas — uma linha por categoria fixa da planilha oficial (CUSTA_LABELS),
// com as duas naturezas (já paga / projetada) lado a lado como colunas, mais o Total da linha. Já
// vem pronta (planilha embutida) ou cadastrada na mão (c.custasPagasOverride/custasProjOverride).
function custasCadastroTable(c, editavel){
  const valoresPagas = getCustasPagas(c)||{};
  const valoresProj = getCustasProj(c)||{};
  const overridePagas = c.custasPagasOverride||{};
  const overrideProj = c.custasProjOverride||{};
  const celula = (grupo, field, val, overrideObj)=>{
    const overridden = overrideObj[field] !== undefined;
    const tag = overridden ? ' <span class="sub" style="font-size:9px;color:var(--info)">●</span>' : '';
    return editavel
      ? `<input type="text" value="${fmtMoney(val).replace('R$ ','')}" onchange="updateCustaCadastro(${c.id}, '${grupo}', '${field}', this.value)" style="width:100%;text-align:right;font-size:12.5px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)">${tag}`
      : `${fmtMoney(val)}${tag}`;
  };
  const rows = Object.keys(CUSTA_LABELS).map(field=>{
    const vp = valoresPagas[field] || 0, vf = valoresProj[field] || 0;
    return `<tr>
      <td style="font-size:12px">${esc(CUSTA_LABELS[field])}</td>
      <td class="num" style="width:130px">${celula('pagas', field, vp, overridePagas)}</td>
      <td class="num" style="width:130px">${celula('proj', field, vf, overrideProj)}</td>
      <td class="num" style="width:110px">${fmtMoney(vp+vf)}</td>
    </tr>`;
  }).join('');
  const totalPagas = Object.keys(CUSTA_LABELS).reduce((s,f)=>s+(valoresPagas[f]||0),0);
  const totalProj = Object.keys(CUSTA_LABELS).reduce((s,f)=>s+(valoresProj[f]||0),0);
  return `<div class="tablewrap"><table class="parctable">
    <thead><tr><th>Item</th><th class="num">Já pagas</th><th class="num">Futuras</th><th class="num">Total</th></tr></thead>
    <tbody>${rows}<tr style="font-weight:700"><td>Total</td><td class="num">${fmtMoney(totalPagas)}</td><td class="num">${fmtMoney(totalProj)}</td><td class="num">${fmtMoney(totalPagas+totalProj)}</td></tr></tbody>
  </table></div>`;
}
function renderFinCustas(c){
  const editavel = podeEditarCustas();
  return `<p style="margin:0 0 4px">${editavel ? 'Preencha qualquer categoria abaixo — já paga ou futura (projetada) — mesmo pra unidades sem dado nenhum na planilha. ● marca o que foi cadastrado à mão.' : 'Só Retomada e Administração podem cadastrar/editar estes valores.'}</p>
    ${custasCadastroTable(c, editavel)}`;
}
function updateCustaCadastro(caseId, grupo, field, rawVal){
  const c = findCase(caseId);
  const key = grupo==='pagas' ? 'custasPagasOverride' : 'custasProjOverride';
  const label = grupo==='pagas' ? 'Custas passadas' : 'Custas futuras';
  const before = (grupo==='pagas' ? getCustasPagas(c) : getCustasProj(c)) || {};
  const beforeVal = before[field] || 0;
  const num = round2(parseFloat(String(rawVal).replace(/\./g,'').replace(',','.')) || 0);
  if(!c[key]) c[key] = {};
  c[key][field] = num;
  if(num !== beforeVal){
    logHistory(c, `${label} — "${CUSTA_LABELS[field]}" cadastrado/ajustado: ${fmtMoney(beforeVal)} → ${fmtMoney(num)}`, null);
  }
  c.financeiro = montarFinanceiro(c);
  saveDB();
  detailTab = 'financeiro';
  renderDetailModalPreservingScroll(caseId);
}

// ⚠️ FONTE DA VERDADE DO FLUXO — o switch abaixo (e as outras transições de macro espalhadas pelo
// arquivo: openViabilidadeModal, confirmAddUnidade, etc.) é o que decide de fato pra onde cada caso
// vai. Toda vez que uma etapa, decisão ou saída de exceção mudar aqui, o desenho em renderFluxograma()
// fica desatualizado — ele é hand-drawn, não gerado a partir do código. Atualize os dois juntos.
async function confirmObsAction(id, action){
  const c = findCase(id);
  const motivoEl = g('obsMotivo');
  if(motivoEl && !motivoEl.value){ showToast('Selecione um motivo antes de confirmar.', 'warn'); return; }
  const motivo = motivoEl ? (motivoEl.value==='__outro' ? null : motivoEl.value) : null;
  const obsTextRaw = g('obsText') ? g('obsText').value : '';
  const obsText = motivo ? (obsTextRaw ? `${motivo} — ${obsTextRaw}` : motivo) : obsTextRaw;
  if(motivo) c.motivoEncerramento = motivo;
  // Trava a saída pra Vendas até a Quitação CEF / Reparos / Restituição estarem confirmados
  // (aba Financeiro → Cálculo de viabilidade) — mesmo que o valor real seja R$0.
  if(action==='procuracao' || action==='aprova_recompra_vencida'){
    const faltando = viabCamposFaltando(c);
    if(faltando.length){
      closeModal();
      showToast(`Preencha antes de liberar pra Vendas (Financeiro → Cálculo de viabilidade): ${faltando.join('; ')}.`, 'warn');
      return;
    }
  }
  // Aprovação Comercial precisa de DOIS arquivos anexados: aprovação e fluxo de venda. Se
  // algum ainda não tem, a caixa de anexo já apareceu no próprio modal (openObsModal) — sobe o
  // arquivo aqui e já segue o fluxo, sem exigir um passo separado antes. Se já tem, só confirma
  // com o "OK" marcado. Os dois precisam estar resolvidos antes de deixar passar.
  let anexosDaAprovacao = [];
  if(action==='aprovacao_comercial'){
    const btn = g('obsConfirmBtn');
    const temPdf = (c.docsExtras||[]).some(d=>d.startsWith('Viabilidade —')||d.startsWith('Aprovação Comercial —'));
    if(!temPdf){
      const fileInput = g('aprovAnexo');
      const file = fileInput && fileInput.files[0];
      if(!file){ showToast('Anexe o PDF/imagem da aprovação antes de confirmar.', 'warn'); return; }
      if(btn){ btn.disabled = true; btn.textContent = 'Enviando anexos…'; }
      const anexos = await processAnexos(c.id, fileInput.files);
      if(anexos === null){ if(btn){ btn.disabled=false; btn.textContent='Confirmar'; } return; }
      anexosDaAprovacao = anexosDaAprovacao.concat(anexos);
      if(!c.docsExtras) c.docsExtras = [];
      c.docsExtras.push(`Aprovação Comercial — ${c.unidade} (${nowStr().split(' ')[0]}).pdf`);
    } else {
      const ok = g('okPdfAnexado');
      if(!ok || !ok.checked){
        showToast('Marque "OK, PDF anexado" antes de confirmar.', 'warn');
        return;
      }
    }
    const temFluxo = (c.docsExtras||[]).some(d=>d.startsWith('Fluxo de Venda —'));
    if(!temFluxo){
      const fileInput = g('fluxoAnexo');
      const file = fileInput && fileInput.files[0];
      if(!file){ showToast('Anexe o PDF/imagem do fluxo de venda antes de confirmar.', 'warn'); return; }
      if(btn){ btn.disabled = true; btn.textContent = 'Enviando anexos…'; }
      const anexos = await processAnexos(c.id, fileInput.files);
      if(anexos === null){ if(btn){ btn.disabled=false; btn.textContent='Confirmar'; } return; }
      anexosDaAprovacao = anexosDaAprovacao.concat(anexos);
      if(!c.docsExtras) c.docsExtras = [];
      c.docsExtras.push(`Fluxo de Venda — ${c.unidade} (${nowStr().split(' ')[0]}).pdf`);
    } else {
      const ok = g('okFluxoAnexado');
      if(!ok || !ok.checked){
        showToast('Marque "OK, fluxo de venda anexado" antes de confirmar.', 'warn');
        return;
      }
    }
  }
  logHistory(c, ACTION_EVENTS[action]||action, obsText, anexosDaAprovacao.length?anexosDaAprovacao:null);
  c.dias = 0;
  switch(action){
    case 'interesse': c.macro='recompras'; c.subFase='EM CONTATO'; break;
    case 'recusa': case 'recusa_seguir': case 'sem_contato': c.macro='encerrado'; c.subFase=undefined; break;
    // "Recompra direta" (c.recompraDireta, marcada à mão) — não é Transferência Assistida: assinada
    // a procuração, a Metrocasa já corre pra recomprar de verdade, sem tentar achar comprador
    // primeiro. Pula Vendas Livre/Viabilidade inteiros, vai reto pra Distratos liberar o estoque —
    // mesmo destino final da recompra por procuração vencida (aprova_recompra_vencida, ali embaixo).
    case 'procuracao':
      if(c.recompraDireta){
        c.macro='distratos'; c.braco='recompra'; c.subFase=undefined; c.procuracaoVencida=false;
      } else {
        c.macro='vendas_livre'; c.subFase=undefined; c.procuracaoVencida=false;
        c.procuracaoVencimento = addDias(new Date().toISOString().split('T')[0] /*UTC-PROPOSITAL: par do gatilho acima*/, PROC_CONFIG.validadeDias);
      }
      break;
    // Procuração venceu sem comprador — a Retomada aprova a recompra de verdade (deixa de ser
    // Transferência Assistida, braco='recompra') e a unidade já sai direto pra Distratos, pro
    // time liberar pro estoque geral (não é o mesmo estoque/fluxo da recompra à vista que sai
    // da Aprovação Comercial — daqui em diante segue igual: Distratos → Contratos → Concluído).
    case 'aprova_recompra_vencida':
      c.macro='distratos'; c.braco='recompra'; c.subFase=undefined; c.procuracaoVencida=false;
      break;
    // Quem registra o interesse "assume" o negócio — some do pool geral e passa a aparecer
    // só na aba "Vendas" (pessoal) dessa pessoa, não mais em "Disponíveis para Negociação".
    case 'registrar_interesse': c.macro='viabilidade'; c.interesseEm=Date.now(); c.vendedor=CURRENT_USER.nome; break;
    // A forma de pagamento foi escolhida na hora de gerar o PDF de viabilidade (c.viabForma).
    // À vista = a Transferência Assistida virou recompra: volta pra esteira de Recompras pra
    // executar a recompra de verdade (não é mais a procuração original — braco='recompra' sinaliza isso).
    case 'aprovacao_comercial':
      if(c.viabForma==='avista'){ c.macro='recompras'; c.braco='recompra'; c.subFase='EM CONTATO'; }
      else { c.macro='credito'; c.braco='cessao'; }
      break;
    case 'recompra_concluida': c.macro='distratos'; c.subFase=undefined; break;
    case 'credito_aprova': c.macro='repasse'; c.subFase='NEGOCIAÇÃO'; c.minutaGerada=false; break;
    case 'credito_reprova': c.macro='vendas_livre'; c.braco=null; break;
    case 'cessao_uau': c.macro='concluido'; c.subFase=undefined; break;
    case 'liberar_unidade': c.macro='contratos_recompra'; break;
    case 'recompra_uau': c.macro='concluido'; break;
    case 'assinatura_presencial': c.macro='contratos_cessao'; break;
  }
  c.documentos = montarDocumentos(c);
  c.financeiro = montarFinanceiro(c);
  saveDB(); closeModal(); render();
}

// Cálculo de viabilidade — a mesma conta da aba Financeiro (renderCustasViabilidade), aqui no fluxo de
// Vendas. Primeiro se escolhe a forma de pagamento (À vista → recompra; Financiado → cessão), depois
// "Gerar PDF": imprime o relatório, salva como documento do caso e move pra Aguardando Aprovação Comercial.
function openViabilidadeModal(id){
  const c = findCase(id);
  const eleg = calcElegibilidade(c);
  // Cessão (Transferência Assistida) só vale dentro dos 180 dias do Habite-se — fora do prazo, só recompra.
  const dentroDoPrazo = eleg.diasRestantes===null || eleg.diasRestantes>=0;
  const forma = dentroDoPrazo ? (c.viabForma || 'financiado') : 'avista';
  const avisoPrazo = !dentroDoPrazo
    ? `<div class="warn-flag" style="margin:2px 0 12px">⚠ Unidade fora do prazo dos 180 dias do Habite-se (venceu há ${Math.abs(eleg.diasRestantes)} dias) — só é permitida <b>Recompra</b>. Cessão (Transferência Assistida) exige estar dentro do prazo.</div>`
    : '';
  // Recompra direta: já é recompra por definição (a unidade só voltou pro pool porque a
  // Metrocasa já recomprou dela) — não faz sentido oferecer "Cessão" nem forçar "à vista"
  // especificamente (a recompra pode ter sido financiada — CEF ou direto, tanto faz aqui).
  // Reaproveita viabForma='avista' internamente (mesma rota pra recompras/braco='recompra'
  // já implementada), só troca o rótulo pra não sugerir pagamento à vista.
  const formaHtml = c.recompraDireta
    ? `<label>Forma</label>
       <div class="viewtoggle" id="viabFormaToggle" style="display:inline-flex;margin:2px 0 12px">
         <button class="vtbtn active" data-forma="avista" onclick="selViabForma(this)">🔁 Recompra</button>
       </div>`
    : `<label>Forma de pagamento</label>
       <div class="viewtoggle" id="viabFormaToggle" style="display:inline-flex;margin:2px 0 12px">
         <button class="vtbtn ${forma==='avista'?'active':''}" data-forma="avista" onclick="selViabForma(this)">💰 À vista (recompra)</button>
         <button class="vtbtn ${forma==='financiado'?'active':''}" data-forma="financiado" onclick="selViabForma(this)" ${dentroDoPrazo?'':'disabled title="Fora do prazo dos 180 dias — só recompra"'}>🏦 Financiado (cessão)</button>
       </div>`;
  g('modalBox').className = 'modal wide';
  g('modalBox').innerHTML = `
    <h3>Cálculo de viabilidade</h3>
    <p><b>${c.unidade}</b> · ${c.empreendimento} · ${c.cliente}${eleg.habiteSe?` · Habite-se: ${eleg.habiteSe}`:''}</p>
    ${c.recompraDireta ? '' : avisoPrazo}
    ${formaHtml}
    ${renderCustasViabilidade(c)}
    <label>Observação (opcional)</label>
    <textarea id="obsText" rows="3" placeholder="Ex: Viabilidade calculada, financiamento Caixa 80%."></textarea>
    <div class="btnrow"><button class="act ghost" onclick="closeModal()">Cancelar</button><button class="act primary" onclick="gerarPdfViabilidade(${id})">📄 Gerar PDF</button></div>
  `;
  g('modalOverlay').classList.add('show');
}
function selViabForma(btn){
  document.querySelectorAll('#viabFormaToggle .vtbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function getViabFormaSel(){
  const b = document.querySelector('#viabFormaToggle .vtbtn.active');
  return b ? b.getAttribute('data-forma') : 'financiado';
}
function gerarPdfViabilidade(id){
  const c = findCase(id);
  const eleg = calcElegibilidade(c);
  const dentroDoPrazo = eleg.diasRestantes===null || eleg.diasRestantes>=0;
  let forma = getViabFormaSel();
  if(!dentroDoPrazo && forma==='financiado'){
    forma = 'avista';
    showToast('Unidade fora do prazo dos 180 dias — forçado para Recompra.', 'warn');
  }
  const obsText = g('obsText') ? g('obsText').value : '';
  const values = buildViabilidadeValues(c);
  const total = totalViabilidade(values);
  const clasPdf = viabClassificacao(total);
  const statusTxt = `${clasPdf.icon} ${clasPdf.label.toUpperCase()}`;
  const agora = nowStr();
  // Rótulo: recompra direta é sempre "Recompra" puro (não implica pagamento à vista — pode ter
  // sido financiada). Fluxo normal de TA mantém o rótulo completo de sempre.
  const formaLabel = c.recompraDireta ? 'Recompra' : (forma==='avista'?'À vista (recompra)':'Financiado (cessão)');

  // 1) Relatório imprimível — o "Salvar como PDF" do navegador gera o arquivo real
  const linhas = VIAB_ITEMS.map(it=>`<tr>
      <td>${it.sinal===1?'(+)':'(−)'} ${esc(it.desc)}</td>
      <td style="text-align:right">${fmtMoney(values[it.id])}</td>
    </tr>`).join('');
  const pdfHtml = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Viabilidade ${esc(c.unidade)}</title>
    <style>
      body{font-family:'Segoe UI',Arial,sans-serif;color:#201d1a;margin:36px;font-size:13px}
      h1{font-size:18px;margin:0 0 2px;color:#e2231a} .sub{color:#6b6459;font-size:12px;margin-bottom:18px}
      table{width:100%;border-collapse:collapse;margin-top:10px}
      th{text-align:left;font-size:11px;color:#6b6459;text-transform:uppercase;border-bottom:2px solid #e2231a;padding:6px 8px}
      td{padding:6px 8px;border-bottom:1px solid #e6e2dc}
      .total td{font-weight:700;font-size:15px;border-top:2px solid #201d1a;border-bottom:none}
      .status{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:6px;font-weight:700;background:${clasPdf.key==='inviavel'?'#f7e9d4':'#e1f0e4'};color:${clasPdf.key==='inviavel'?'#b5651d':'#3b7a4c'}}
      .meta{margin-top:22px;font-size:11px;color:#9c948a}
    </style></head><body>
    <h1>Metrocasa — Cálculo de Viabilidade</h1>
    <div class="sub">${esc(c.unidade)} · ${esc(c.empreendimento)} · ${esc(c.cliente)} · Forma: <b>${formaLabel}</b></div>
    <table><thead><tr><th>Item</th><th style="text-align:right">Valor</th></tr></thead>
      <tbody>${linhas}<tr class="total"><td>Resultado</td><td style="text-align:right">${fmtMoney(total)}</td></tr></tbody></table>
    <div class="status">${statusTxt}</div>
    ${obsText?`<p style="margin-top:14px"><b>Observação:</b> ${esc(obsText)}</p>`:''}
    <div class="meta">Gerado em ${agora} por ${esc(CURRENT_USER.nome)} · Transferência Assistida</div>
    <script>window.print()<\/script></body></html>`;
  abrirJanelaImpressao(pdfHtml, ' — o caso avançou mesmo assim.');

  // 2) Registra o PDF como documento do caso (sobrevive às transições via docsExtras)
  const docName = `Viabilidade — ${c.unidade} (${agora.split(' ')[0]}).pdf`;
  if(!c.docsExtras) c.docsExtras = [];
  if(!c.docsExtras.includes(docName)) c.docsExtras.push(docName);

  // 3) Anexa o resultado e move pra Aguardando Aprovação Comercial
  c.viabForma = forma;
  c.dias = 0;
  c.macro = 'aprovacao_comercial';
  c.financeiro = montarFinanceiro(c);
  c.financeiro.custasProjetadas = VIAB_ITEMS.filter(it=>it.sinal===-1).map(it=>({item:it.desc, valor:values[it.id]}));
  c.financeiro.viabilidade = { status:'em análise', resultado: total, dataAprovacao: null };
  c.documentos = montarDocumentos(c);
  logHistory(c, `PDF de viabilidade gerado — ${formaLabel} · Resultado: ${fmtMoney(total)} (${statusTxt})`, obsText);
  saveDB(); closeModal(); render();
  showToast('PDF gerado e anexado — caso aguardando Aprovação Comercial.', 'ok');
}

function confirmDistrato(alertId){
  const a = ALERTS.find(x=>x.id===alertId);
  const c = a ? findCase(a.caseId) : null;
  if(!c){ showToast('Caso não encontrado — o alerta pode estar órfão.', 'warn'); return; }
  const motivo = g('obsText').value || a.motivo;
  const prevMacro = c.macro;

  const targets = macroToRoles(prevMacro).concat(['admin']);
  targets.forEach(role=>{
    ALERTS.push({id: nextAlertId(), caseId:c.id, tipo:'distrato_confirmado', motivo, criadoEm: nowStr(), destino:[role], resolvido:false});
  });

  saveDB(); closeModal(); render();
}

function onAddUnidadeEmpChange(){
  const emp = g('addEmp').value;
  const wrap = g('addUnidadeWrap');
  if(!emp){
    wrap.innerHTML = `<label>Unidade</label><select id="addUnidadeSelect" disabled><option value="">— selecione o empreendimento primeiro —</option></select>`;
    return;
  }
  const units = unidadesDoEmpreendimento(emp);
  if(units.length){
    wrap.innerHTML = `<label>Unidade</label>
      <select id="addUnidadeSelect">
        <option value="">— selecione —</option>
        ${units.map(u=>`<option value="${esc(u.chave)}">${esc(u.bloco)}-${esc(u.unidade)}</option>`).join('')}
      </select>`;
  } else {
    // Empreendimento sem unidade ainda na base de negociação — permite digitar manualmente
    wrap.innerHTML = `<label>Unidade <span class="sub">— empreendimento ainda sem unidade na base de negociação; digite bloco e número</span></label>
      <input type="text" id="addUnidadeManual" placeholder="Ex: U-0210">`;
  }
}
function confirmAddUnidade(){
  const emp = g('addEmp').value;
  const selEl = g('addUnidadeSelect');
  const manualEl = g('addUnidadeManual');
  const chave = selEl ? selEl.value : '';
  const manual = manualEl ? manualEl.value.trim() : '';
  const cliente = g('addCliente').value.trim();
  const valor = parseFloat((g('addValor').value||'0').replace(/[^\d,.-]/g,'').replace(',','.')) || 0;
  const obsText = g('obsText').value;
  if(!emp || (!chave && !manual) || !cliente){ showToast('Preencha empreendimento, unidade e cliente.', 'warn'); return; }

  const catalogEntry = chave ? UNIT_CATALOG.find(u=>u.chave===chave) : null;
  const newId = DB.reduce((m,c)=>Math.max(m,c.id),0) + 1;
  // Destino só existe pro Admin (ver openAddUnidadeModal) -- os demais perfis sempre caem em
  // relacionamento, igual sempre foi.
  const destinoEl = g('addDestino');
  const destino = destinoEl ? destinoEl.value : 'relacionamento';
  const novoCaso = {
    id: newId,
    unidade: catalogEntry ? `${catalogEntry.bloco}-${catalogEntry.unidade}` : (manual || '—'),
    empreendimento: emp,
    cliente,
    valor,
    macro: destino,
    subFase: destino==='relacionamento' ? RELAC_FASE_INICIAL : undefined,
    braco: null,
    dias: 0,
    analista: null,
    chave: chave || null,
    tarefas: [],
    history: [{date: nowStr(), evento: destino==='vendas_livre' ? 'Unidade cadastrada direto no estoque (Disponível para Negociação) pela Administração' : 'Caso cadastrado na esteira', por:'Você', obs: obsText||undefined}],
  };
  novoCaso.financeiro = montarFinanceiro(novoCaso);
  novoCaso.documentos = montarDocumentos(novoCaso);
  DB.push(novoCaso);
  saveDB();
  closeModal();
  // Só quem pode distribuir vai pra tela do Gestor; os demais ficam onde estavam
  const ehGestor = CURRENT_USER && ['admin','relacionamento_gestor'].includes(CURRENT_USER.perfil);
  setView(ehGestor ? 'relacionamento_gestor' : currentView);
  showToast(`Unidade ${novoCaso.unidade} adicionada à esteira.`, 'ok');
}

document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id==='modalOverlay') closeModal();
});

initAuth();
</script>
