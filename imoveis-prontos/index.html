function setBaseUnidFonte(fonte){
  baseUnidFonte = fonte;
  if(baseUnidQuery) buscarBaseUnidades(baseUnidQuery, true);
  else render();
}
// Busca server-side com debounce — a base tem 8+ mil linhas, não dá pra carregar tudo no navegador.
function buscarBaseUnidades(q, imediato){
  baseUnidQuery = q;
  clearTimeout(buscarBaseUnidades._t);
  const executa = async ()=>{
    const termo = (baseUnidQuery||'').trim();
    if(termo.length < 2){ baseUnidResultados = []; render(); return; }
    baseUnidBuscando = true; render();
    try{
      // sanitiza: vírgula/parênteses/% quebram a sintaxe do filtro "or" do PostgREST
      const t = termo.replace(/[,()%]/g, ' ').trim();
      let query = supa.from('unidades_referencia').select('*')
        .or(`chave.ilike.%${t}%,cliente_antigo.ilike.%${t}%`)
        .order('chave').limit(50);
      if(baseUnidFonte) query = query.eq('status_fonte', baseUnidFonte);
      const {data, error} = await query;
      if(error) throw error;
      baseUnidResultados = data || [];
    }catch(e){
      console.error('Busca na base de unidades falhou', e);
      showToast('Não consegui buscar na base — verifique a conexão.', 'warn');
      baseUnidResultados = [];
    }
    baseUnidBuscando = false; render();
  };
  if(imediato) executa();
  else buscarBaseUnidades._t = setTimeout(executa, 350);
}

function tabelaoRawCol(r, idx){
  if(!r || !r.raw || idx===undefined) return null;
  const v = r.raw['col'+idx];
  return (v===undefined || v===null || v==='') ? null : v;
}
function tabelaoFmtData(v){
  if(!v) return '—';
  if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10).split('-').reverse().join('/');
  return String(v);
}
// A planilha de origem é inconsistente na coluna "Unidade" e isso varia até por fonte (Estoque
// x Histórico x Planilha atual) pra unidade física idêntica: às vezes escreve "U-0210" completo,
// às vezes só o número com zero à esquerda ("0210"), às vezes o Google Sheets lê a célula como
// número e perde o zero à esquerda ("210"). Em vez de tentar adivinhar qual fonte faz o quê, a
// gente gera TODAS as variações plausíveis da chave canônica (com/sem "U-", com/sem zero à
// esquerda) e busca todas de uma vez, casando de volta pela chave canônica — sem precisar
// re-rodar o sync nem mexer no Apps Script.
function tabelaoChaveVariantes(chaveCanonica){
  const out = new Set([chaveCanonica]);
  const m = chaveCanonica.match(/^(.*) U-(\d+)$/); // só cobre bloco "U" com número puro (o caso comum)
  if(m){
    const prefixo = m[1], numero = m[2];
    out.add(`${prefixo} ${numero}`); // sem "U-", com zeros
    const semZeros = String(parseInt(numero, 10));
    out.add(`${prefixo} ${semZeros}`); // sem "U-", sem zeros
    out.add(`${prefixo} U-${semZeros}`); // com "U-", sem zeros (por garantia)
  }
  // Rede de segurança: gera também a variante sem acento de cada candidata já montada acima —
  // o banco já foi normalizado (supabase-normalizar-acentos-chave.sql) e o sync já não introduz
  // acento novo, mas isso cobre qualquer dado que escape disso (import manual, edição direta).
  [...out].forEach(c => out.add(semAcento(c)));
  return [...out];
}

  if(!supa || !supabaseOnline){ tabelaoTempDados = []; return; }
  tabelaoTempCarregando = true; render();
  try{
    const variantesPorUnidade = TABELAO_TEMP_UNIDADES.map(u=>tabelaoChaveVariantes(u.chave));
    const chavesParaBuscar = [...new Set(variantesPorUnidade.flat())];
    const {data, error} = await supa.from('unidades_referencia').select('*').in('chave', chavesParaBuscar);
    if(error) throw error;
    const porChave = {};
    (data||[]).forEach(r=>{ porChave[r.chave] = r; });
    tabelaoTempDados = TABELAO_TEMP_UNIDADES.map((u, i)=>{
      const variantes = variantesPorUnidade[i];
      let r = null;
      for(const v of variantes){ if(porChave[v]){ r = porChave[v]; break; } }
      const estagio = (r && r.estagio) || '';
      const validada = /valida[dr]/i.test(estagio); // "validada"/"validado" — a planilha usa as duas formas
      const colIdx = r ? TABELAO_COL28_IDX[r.status_fonte] : undefined;
      const colValIdx = r ? TABELAO_COLVALIDACAO_IDX[r.status_fonte] : undefined;
      return {
        chave: u.chave,
        grupo: u.grupo,
        achou: !!r,
        status_fonte: r ? r.status_fonte : null,
        cliente_atual: r ? (r.cliente_antigo || null) : null,
        estagio,
        validada,
        dataExibida: validada ? tabelaoFmtData(tabelaoRawCol(r, colValIdx)) : tabelaoFmtData(r && r.data_venda_antiga),
        estagioRepasse: validada ? (tabelaoRawCol(r, colIdx) || '—') : '—',
      };
    });
  }catch(e){
    console.error('Falha ao carregar o tabelão', e);
    showToast('Não consegui carregar o tabelão.', 'warn');
    tabelaoTempDados = [];
  }
  tabelaoTempCarregando = false; render();
}

// contagem já calculada em cima da base filtrada pelos OUTROS filtros (menos o dele mesmo),
// pra dar uma ideia real de quanto cada opção rende sem precisar já aplicar o clique.
function tabelaoChipsFiltro(titulo, opcoes, atual, onClickFn){
  const btns = opcoes.map(o=>
    `<button class="vtbtn ${atual===o.key?'active':''}" onclick="${onClickFn}(${o.key===null?'null':`'${o.key}'`})">${esc(o.label)}</button>`
  ).join('');

function renderTabelaoTemp(){
  if(tabelaoTempDados===null && !tabelaoTempCarregando){ carregarTabelaoTemp(); }
  const head = `<div class="pagehead">
      <div><h1>🧾 Tabelão (temporário)</h1><p>Visão de trabalho — cruza os 4 grupos (Recompra Direta / Recompra Futura / Elegível pra Recompra / Elegível pra Transferência Assistida) com o status real sincronizado das planilhas. Tela temporária, só Admin vê — pode ser removida depois.</p></div>
    </div>`;
  if(tabelaoTempCarregando || tabelaoTempDados===null) return head + `<div class="empty">Carregando…</div>`;

  const base = tabelaoTempDados;
  // Ponte Tabelão → esteira: pré-indexa os casos vivos por chave (O(n) em vez de O(n²)).
  // É isso que materializa o estado "base não trabalhada": grupo de recompra SEM caso vivo.
  const porChaveDB = new Map(DB.map(c=>[c.chave, c]));
  const casoDe = d => porChaveDB.get(d.chave) || null;
  const filtrado = d =>
    (!tabelaoTempFiltroGrupo || d.grupo===tabelaoTempFiltroGrupo) &&
    (!tabelaoTempFiltroStatus || (tabelaoTempFiltroStatus==='achou' ? d.achou : !d.achou)) &&
    (!tabelaoTempFiltroFonte || d.status_fonte===tabelaoTempFiltroFonte) &&
    (!tabelaoTempFiltroValidada || (tabelaoTempFiltroValidada==='sim' ? d.validada : !d.validada)) &&
    (!tabelaoTempFiltroEsteira || (tabelaoTempFiltroEsteira==='na_esteira' ? !!casoDe(d) : !casoDe(d)));

  const chipsGrupo = tabelaoChipsFiltro('Grupo', [{key:null,label:'Todos ('+base.length+')'}]
    .concat(TABELAO_GRUPO_ORDEM.map(g2=>({key:g2, label:g2+' ('+base.filter(d=>d.grupo===g2).length+')'}))), tabelaoTempFiltroGrupo, 'setTabelaoFiltroGrupo');

  const chipsStatus = tabelaoChipsFiltro('Status na base', [
    {key:null, label:'Todas ('+base.length+')'},
    {key:'achou', label:'✓ Encontradas ('+base.filter(d=>d.achou).length+')'},
    {key:'nao_achou', label:'✗ Não encontradas ('+base.filter(d=>!d.achou).length+')'},
  ], tabelaoTempFiltroStatus, 'setTabelaoFiltroStatus');

  const chipsFonte = tabelaoChipsFiltro('Onde está', [{key:null,label:'Todas ('+base.length+')'}]
    .concat(Object.keys(FONTE_META).map(f=>({key:f, label:FONTE_META[f].label+' ('+base.filter(d=>d.status_fonte===f).length+')'}))), tabelaoTempFiltroFonte, 'setTabelaoFiltroFonte');

  const chipsValidada = tabelaoChipsFiltro('Validada?', [
    {key:null, label:'Todas ('+base.length+')'},
    {key:'sim', label:'✓ Validadas ('+base.filter(d=>d.validada).length+')'},
    {key:'nao', label:'Não validadas ('+base.filter(d=>!d.validada).length+')'},
  ], tabelaoTempFiltroValidada, 'setTabelaoFiltroValidada');

  const chipsEsteira = tabelaoChipsFiltro('Na esteira?', [
    {key:null, label:'Todas ('+base.length+')'},
    {key:'na_esteira', label:'Com caso vivo ('+base.filter(d=>casoDe(d)).length+')'},
    {key:'nao_trabalhada', label:'Não trabalhada ('+base.filter(d=>!casoDe(d)).length+')'},
  ], tabelaoTempFiltroEsteira, 'setTabelaoFiltroEsteira');

  const linhas = base.filter(filtrado);
  const rows = linhas.map(d=>{
    const fonte = d.status_fonte ? FONTE_META[d.status_fonte] : null;
    const caso = casoDe(d);
    return `<tr>
      <td>${esc(d.grupo)}</td>
      <td><b class="unid" onclick="openDetailModalPorChave('${esc(d.chave)}')" title="${caso?'Abrir a ficha na esteira':'Sem caso vivo na esteira'}">${esc(d.chave)}</b></td>
      <td>${d.achou ? `<span class="badge ${fonte.cls}">${fonte.label}</span>` : '<span class="badge muted">não encontrada</span>'}</td>
      <td>${caso ? `${caseBadge(caso)} ${bracoLabel(caso.braco)}` : '<span class="badge muted">não trabalhada</span>'}</td>
      <td>${esc(d.cliente_atual || '—')}</td>
      <td>${esc(d.estagio || '—')}</td>
      <td>${d.validada ? '<span class="badge ok">✓ validada</span>' : '<span class="sub">—</span>'}</td>
      <td>${esc(d.dataExibida)}</td>
      <td>${esc(String(d.estagioRepasse))}</td>
    </tr>`;
  }).join('');

  return head + `
    <div style="background:var(--bg-raised);border-radius:10px;margin-bottom:14px;padding:12px 14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">

      <div class="sub" style="margin-top:4px">Mostrando ${linhas.length} de ${base.length} unidades.</div>
    </div>
    <div class="tablewrap tall"><table>
      <thead><tr><th>Grupo</th><th>Unidade</th><th>Onde está</th><th>Na esteira?</th><th>Cliente atual</th><th>Estágio de contrato</th><th>Validada?</th><th>Data (contrato ou validação)</th><th>Coluna "28" (só se validada)</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="9" class="empty">Nada nesse filtro.</td></tr>'}</tbody>
    </table></div>

// Salva as custas oficiais editadas no modal — upsert em custas_unidades (cria a linha se a
// unidade ainda não tinha) + atualiza CUSTAS_PAGAS/CUSTAS_PROJ em memória, pra qualquer cálculo
// de viabilidade já usar o valor novo sem precisar recarregar a página. Total recalculado aqui.
async function salvarCustasOficiais(){
  const r = baseUnidSel;
  if(!r) return;
  const parseMoney = v => round2(parseFloat(String(v||'').replace(/\./g,'').replace(',','.')) || 0);
  const monta = prefixo => {
    const obj = {};
    let soma = 0;
    Object.keys(CUSTA_LABELS).filter(f=>f!=='total').forEach(field=>{
      const el = g(prefixo+'_'+field);
      const val = el ? parseMoney(el.value) : 0;
      obj[field] = val;
      soma += val;
    });
    obj.total = round2(soma);
    return soma > 0 ? obj : null;
  };
  const pagas = monta('ofPaga');
  const proj = monta('ofProj');
  const btn = document.querySelector('#modalBox .act.primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Salvando…'; }
  try{
    const {error} = await supa.from('custas_unidades').upsert({
      chave: r.chave,
      custas_pagas: pagas,
      custas_projetadas: proj,
      recompra_futura: RECOMPRA_FUTURA_UNITS.has(r.chave),
      atualizado_em: new Date().toISOString(),
    }, {onConflict: 'chave'});
    if(error) throw error;
    // memória em dia — viabilidade e ficha do caso refletem na hora
    if(pagas) CUSTAS_PAGAS[r.chave] = pagas; else delete CUSTAS_PAGAS[r.chave];
    if(proj) CUSTAS_PROJ[r.chave] = proj; else delete CUSTAS_PROJ[r.chave];
    baseUnidEditOficiais = false;
    renderBaseUnidadeModal();
    showToast('Custas oficiais salvas em ' + r.chave + '.', 'ok');
  }catch(e){
    console.error('Falha ao salvar custas oficiais', e);
    showToast('Não consegui salvar as custas — confirme que o SQL de permissão (custas-unidades-editavel) foi rodado.', 'warn');
    if(btn){ btn.disabled = false; btn.textContent = '💾 Salvar custas oficiais'; }
  }
}

// Exporta o SVG do fluxograma como PNG. O SVG na tela herda cor via CSS (var(--text) etc,
// definida no <style> da própria página) — pra virar arquivo, precisa resolver essas cores
// em valores concretos antes de serializar, porque uma vez fora do DOM da página o SVG
// não enxerga mais as variáveis do :root.
function baixarFluxogramaPNG(){
  const original = document.querySelector('#main svg');
  if(!original){ showToast('Abra o Fluxograma antes de baixar.', 'warn'); return; }
  showToast('Gerando imagem…', 'info');
  const svg = original.cloneNode(true);
  const cs = getComputedStyle(document.documentElement);
  const col = (name, fallback) => (cs.getPropertyValue(name)||'').trim() || fallback;
  const cText=col('--text','#201d1a'), cMuted=col('--muted','#6b6459'), cFaint=col('--faint','#9c948a'),
        cBgRaised=col('--bg-raised','#ffffff'), cBg=col('--bg','#f7f5f1'), cAccent=col('--accent','#12727d'),
        cInfoSoft=col('--info-soft','#dee6f2'), cAccentSoft=col('--accent-soft','#ddecec'),
        cWarnSoft=col('--warn-soft','#f7e9d4'), cOkSoft=col('--ok-soft','#e1f0e4'), cOk=col('--ok','#3b7a4c'), cWarn=col('--warn','#a86a1c');

  // tamanho real do desenho ativo (o simples e o técnico usam viewBox diferentes)
  const vb = (svg.getAttribute('viewBox')||'0 0 1100 980').split(/\s+/).map(Number);
  const W = vb[2] || 1100, H = vb[3] || 980;

  // classes do fluxograma técnico (o simples não usa classe, usa fill="var(...)" direto nos elementos)
  // filtro de sombra só existe no <defs> do modo "completo" — aplicar a referência nos outros modos
  // deixaria os nós invisíveis (SVG não renderiza elemento com filter apontando pra id inexistente).
  const shadowRule = fluxoModo==='completo' ? 'filter:url(#fxShadow)' : '';
  const styleEl = document.createElementNS('http://www.w3.org/2000/svg','style');
  styleEl.textContent = `
    text{font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
    .fxnode{fill:${cBgRaised};stroke:${cText};stroke-width:1.4;${shadowRule}}
    .fxnode.exit{fill:${cBg};stroke:${cFaint};stroke-width:1.2;stroke-dasharray:5 4;filter:none}
    .fxnode.terminal{fill:${cOkSoft};stroke:${cOk};stroke-width:2.2}
    .fxnode.decision{fill:${cAccentSoft};stroke:${cAccent}}
    .fxlane{fill:${cBg};opacity:.55;stroke:${cFaint};stroke-width:1;stroke-dasharray:3 4}
    .fxlanelbl{font-size:12px;font-weight:750;letter-spacing:.02em}
    .fxstart{fill:${cAccent};font-size:9.5px;font-weight:800;letter-spacing:.08em}
    .fxstartchip{fill:${cAccentSoft}}
    .fxlbl{font-size:14px;font-weight:700;fill:${cText}}
    .fxsub{font-size:10.5px;fill:${cMuted}}
    .fxexitlbl{font-size:12px;font-weight:700;fill:${cText}}
    .fxexittag{font-size:9px;font-weight:800;letter-spacing:.08em;fill:${cFaint}}
    .fxedge{fill:none;stroke:${cText};stroke-width:1.4}
    .fxedge.dashed{stroke:${cFaint};stroke-dasharray:4 4}
    .fxedge.accent{stroke:${cAccent};stroke-width:1.8}
    .fxedge.loop{stroke:${cWarn};stroke-width:1.7;stroke-dasharray:6 4}
    .fxet{font-size:10.5px;fill:${cMuted}}
    .fxet.accent{fill:${cAccent};font-weight:700}
    .fxet.loop{fill:${cWarn};font-weight:700}
    .fxet.dashed{fill:${cMuted}}
    .fxnode.warn{fill:${cWarnSoft};stroke:${cWarn};stroke-width:1.4}
  `;
  svg.insertBefore(styleEl, svg.firstChild);

  // resolve qualquer fill/stroke="var(--nome)" inline (usado no fluxograma simples e nos marcadores
  // de seta dos dois) — fora do DOM da página, o SVG não enxerga mais as variáveis do :root.
  const mapa = {'--text':cText,'--muted':cMuted,'--faint':cFaint,'--bg-raised':cBgRaised,'--bg':cBg,
    '--accent':cAccent,'--info-soft':cInfoSoft,'--accent-soft':cAccentSoft,'--warn-soft':cWarnSoft,'--ok-soft':cOkSoft,'--ok':cOk,'--warn':cWarn};
  svg.querySelectorAll('*').forEach(el=>{
    ['fill','stroke'].forEach(attr=>{
      const v = el.getAttribute(attr);
      if(v && v.startsWith('var(')){
        const nome = v.slice(4, v.indexOf(')')).split(',')[0].trim();
        if(mapa[nome]) el.setAttribute(attr, mapa[nome]);
      }
    });
  });

  const bgRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bgRect.setAttribute('width', W); bgRect.setAttribute('height', H); bgRect.setAttribute('fill', cBg);
  svg.insertBefore(bgRect, svg.firstChild);
  svg.setAttribute('width', W); svg.setAttribute('height', H);

  const svgData = new XMLSerializer().serializeToString(svg);
  const svgUrl = URL.createObjectURL(new Blob([svgData], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  img.onload = function(){
    const scale = 2; // retina
    const canvas = document.createElement('canvas');
    canvas.width = W*scale; canvas.height = H*scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(svgUrl);
    canvas.toBlob(blob=>{
      const link = document.createElement('a');
      link.download = {simples:'fluxograma-simples', tecnico:'fluxograma-tecnico', completo:'fluxograma-tecnico-completo'}[fluxoModo] + '-transferencia-assistida.png';
      link.href = URL.createObjectURL(blob);
      document.body.appendChild(link); link.click(); link.remove();
      showToast('Imagem baixada.', 'ok');
    });
  };
  img.onerror = function(){ URL.revokeObjectURL(svgUrl); showToast('Não consegui gerar a imagem — tenta de novo.', 'warn'); };
  img.src = svgUrl;
}

      <td>${a.resolvido ? '<span class="badge muted">Resolvido</span>' : '<span class="badge warn">Pendente</span>'}</td>
      <td class="unid" onclick="openDetailModal(${c.id})">${esc(c.unidade)}</td>
      <td>${esc(c.cliente)}</td>
      <td>${tipoLabel}</td>
      <td class="sub">${esc(a.motivo)}</td>
      <td class="sub">${destinoLabel}</td>
      <td class="sub">${a.criadoEm}</td>
    </tr>`;
  }).join('');

  const ativas = sortByPriority(DB.filter(c=>!['concluido','encerrado','resolvido_cef','distratado','cancelado_adm'].includes(c.macro)));
  const ativasRows = ativas.map(c=>`<tr data-caseid="${c.id}" data-search="${searchAttr(c)}" data-subfase="${esc(c.subFase||'')}">
    <td><div class="unid" title="Ver detalhes" onclick="openDetailModal(${c.id})">${esc(c.unidade)}</div><div class="sub">${esc(c.empreendimento)} · ${fmtMoney(c.valor)}</div></td>
    <td>${esc(caseDisplayCliente(c))}${c.analista?`<div class="sub">Analista: ${esc(c.analista)}</div>`:''}</td>
    <td>${bracoLabel(c.braco)}</td>
    <td>${caseBadge(c)}</td>
    <td><span class="dias ${c.dias>=8?'late':(c.dias>=5?'warm':'')}">${c.dias}d</span></td>
    <td>${renderTarefaCell(c)}</td>
    <td class="num"><button class="act danger" onclick="openCancelUnidadeModal(${c.id})" title="Cancela a unidade em qualquer etapa — exclusivo da Administração">🛑 Cancelar unidade</button></td>
  </tr>`).join('');

  // Painel dos 180 dias — todas as unidades com elegibilidade calculada, mais urgentes primeiro
  const prazo = DB
    .filter(c=>!['concluido','encerrado','resolvido_cef','distratado','cancelado_adm'].includes(c.macro))
    .map(c=>({c, eleg:c.financeiro && c.financeiro.elegibilidade}))
    .filter(x=>x.eleg && x.eleg.diasRestantes!==null && x.eleg.diasRestantes<=30)
    .sort((a,b)=>a.eleg.diasRestantes-b.eleg.diasRestantes);
  const prazoRows = prazo.map(({c,eleg})=>{
    const vencido = eleg.diasRestantes<0;
    return `<tr data-caseid="${c.id}" data-search="${searchAttr(c)}">
      <td><div class="unid" title="Ver detalhes" onclick="openDetailModal(${c.id})">${esc(c.unidade)}</div><div class="sub">${esc(c.empreendimento)}</div></td>
      <td>${caseBadge(c)}</td>
      <td>${eleg.habiteSe}</td>
      <td><span class="badge ${vencido?'warn':'info'}">${vencido ? `Vencido há ${Math.abs(eleg.diasRestantes)}d` : `Faltam ${eleg.diasRestantes}d`}</span></td>
    </tr>`;
  }).join('');

  // Esteira de Retomada — visão da Administração sobre todos os analistas de uma vez
  // (o Gestor já tem isso com poder de reatribuir; aqui é leitura estruturada: carga, saúde e fila de cada analista)
  const relacCases = sortByPriority(DB.filter(c=>['relacionamento','recompras'].includes(c.macro)));
  const hojeStr = hojeISO();
  const analistaStats = key=>{
    const cs = key===SEM_ATRIBUICAO ? relacCases.filter(c=>!c.analista) : relacCases.filter(c=>c.analista===key);
    return {
      cs,
      total: cs.length,
      contato: cs.filter(c=>c.macro==='relacionamento').length,
      procuracao: cs.filter(c=>c.macro==='recompras').length,
      sla: cs.filter(c=>c.macro==='relacionamento' && c.dias>7).length,
      tarefasAtrasadas: cs.reduce((n,c)=>n+(c.tarefas||[]).filter(t=>!t.concluida && t.data<hojeStr).length,0),
      agendamentos: cs.filter(c=>c.agendamentoData && c.agendamentoData>=hojeStr).length,
    };
  };
  const analistaKeys = [...ANALISTAS, SEM_ATRIBUICAO];
  const porAnalistaAdmin = analistaKeys.map(a=>{
    const st = analistaStats(a);
    const sem = a===SEM_ATRIBUICAO;
    const detalhes = sem
      ? 'precisa do Gestor distribuir'
      : `${st.contato} em contato · ${st.procuracao} rumo à procuração`
        + (st.sla ? ` · <b style="color:var(--warn)">${st.sla} SLA estourado</b>` : '')
        + (st.tarefasAtrasadas ? ` · <b style="color:var(--warn)">${st.tarefasAtrasadas} tarefa(s) atrasada(s)</b>` : '')
        + (st.agendamentos ? ` · ${st.agendamentos} agendamento(s)` : '');
    const boardMode = adminEsteiraViewMode==='board';
    // No modo Quadro o filtro por analista não se aplica (o quadro sempre mostra todos) —
    // cartão vira só leitura pra não fingir um filtro que não filtra.
    return `<div class="kpi ${boardMode?'':'clickable'} ${!boardMode && adminAnalistaFilter===a?'active':''}" ${boardMode?'title="Filtro por analista disponível no modo Lista"':`onclick="admAnalistaSet('${esc(a)}')"`}>
      <div class="lbl">${sem?'⚠ Sem atribuição':esc(a)}</div>
      <div class="val ${sem&&st.total?'bad':''}">${st.total}</div>
      <div class="sla">${detalhes}</div>
    </div>`;
  }).join('');
  const esteiraCases = adminAnalistaFilter ? analistaStats(adminAnalistaFilter).cs : relacCases;
  const esteiraBody = adminEsteiraViewMode==='board'
    ? renderEsteiraPorAnalistaBoard(relacCases)
    : (esteiraCases.length ? renderTable(esteiraCases, 'tblEsteiraAnalistas') : `<div class="empty">${adminAnalistaFilter?`Nenhum caso com ${adminAnalistaFilter===SEM_ATRIBUICAO?'"sem atribuição"':esc(adminAnalistaFilter)} no momento.`:'Nenhum caso na esteira de Retomada no momento.'}</div>`);

  return `
    <div class="pagehead">
      <div><h1><img class="navicon" src="icon_administracao.png" alt="" onerror="this.outerHTML='🛡️'"> Administração</h1><p>Visão executiva: todos os alertas de distrato (sinalizados e confirmados) em qualquer etapa do processo, além do raio-x geral. Só a Administração pode cancelar uma unidade em qualquer momento do fluxo.</p></div>
    </div>
    <div class="kpis">
      ${kpiCard('Total de unidades', DB.length)}
      ${kpiCard('Alertas pendentes', ALERTS.filter(a=>!a.resolvido).length, ALERTS.filter(a=>!a.resolvido).length?'bad':'good')}
      ${kpiCard('Distratos confirmados', DB.filter(c=>c.macro==='distratado').length)}
      ${kpiCard('Canceladas (Admin)', DB.filter(c=>c.macro==='cancelado_adm').length)}
      ${kpiCard('Concluídas (UAU)', DB.filter(c=>c.macro==='concluido').length,'good')}
    </div>
    <h2 class="sectiontitle"><img class="navicon" src="icon_viabilidade.png" alt="" onerror="this.outerHTML='🧮'"> Parâmetros de viabilidade <span class="sub">— define o que conta como viável em toda a esteira de recompra</span></h2>
    <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:26px">
      <div><label class="fieldlbl">Lucro mínimo pra aprovar</label>
        <input type="text" id="viabThMin" value="${VIAB_CONFIG.thMin}" class="field" style="width:140px;background:var(--bg)"></div>
      <div><label class="fieldlbl">Faixa de atenção abaixo de</label>
        <input type="text" id="viabThAlert" value="${VIAB_CONFIG.thAlert}" class="field" style="width:140px;background:var(--bg)"></div>
      <button class="act primary" onclick="saveViabConfig(g('viabThMin').value, g('viabThAlert').value)">Salvar</button>
      <span class="sub">Abaixo do mínimo = inviável. Entre o mínimo e a faixa de atenção = viável, mas sinalizado.</span>
    </div>
    <h2 class="sectiontitle">📜 Validade da procuração <span class="sub">— se ninguém comprar a unidade dentro desse prazo, ela volta pra Retomada reaprovar a recompra</span></h2>
    <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:26px">
      <div><label class="fieldlbl">Vence depois de (dias)</label>
        <input type="text" id="procValidade" value="${PROC_CONFIG.validadeDias}" class="field" style="width:140px;background:var(--bg)"></div>
      <button class="act primary" onclick="saveProcConfig(g('procValidade').value)">Salvar</button>
      <span class="sub">Contado a partir da assinatura. Vale pra procuração nova e pra reaprovação depois de vencida.</span>
    </div>
    <div class="sectiontitle" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span><img class="navicon" src="icon_relacionamento.png" alt="" onerror="this.outerHTML='☎️'"> Esteira de Retomada — por analista <span class="sub">— clique num analista para isolar a fila dele</span></span>
      <span style="flex:1"></span>
      <div class="viewtoggle">
        <button class="vtbtn ${adminEsteiraViewMode==='list'?'active':''}" onclick="admEsteiraSetMode('list')">📋 Lista</button>
        <button class="vtbtn ${adminEsteiraViewMode==='board'?'active':''}" onclick="admEsteiraSetMode('board')">🗂️ Quadro por analista</button>
      </div>
    </div>
    <div class="kpis">${porAnalistaAdmin}</div>
    ${adminAnalistaFilter && adminEsteiraViewMode==='list' ? `<div class="sub" style="margin-bottom:8px">Mostrando só a fila de <b>${adminAnalistaFilter===SEM_ATRIBUICAO?'Sem atribuição':esc(adminAnalistaFilter)}</b> — <a href="#" onclick="event.preventDefault();admAnalistaSet('${esc(adminAnalistaFilter)}')" style="color:var(--accent)">limpar filtro</a></div>` : ''}
    ${esteiraBody}
    <h2 class="sectiontitle">⏰ Prazo dos 180 dias <span class="sub">— vencidos ou vencendo em até 30 dias, mais urgente primeiro</span></h2>
    ${prazo.length ? `${tableToolbar('tblPrazo')}<div class="tablewrap"><table id="tblPrazo">
      <thead><tr><th>Unidade</th><th>Etapa atual</th><th>Habite-se</th><th>Prazo</th></tr></thead>
      <tbody>${prazoRows}</tbody>
    </table></div>` : `<div class="empty">Nenhuma unidade vencida ou perto do limite dos 180 dias.</div>`}
    <h2 class="sectiontitle">Todas as unidades ativas <span class="sub">— ordenado por urgência; cancelamento direto disponível só para este perfil</span></h2>
    ${ativas.length ? `${tableToolbar('tblAdminAtivas', ativas)}<div class="tablewrap tall"><table id="tblAdminAtivas">
      <thead><tr><th>Unidade</th><th>Cliente</th><th>Braço</th><th>Status</th><th>Dias</th><th>Próxima tarefa</th><th class="num">Ação</th></tr></thead>
      <tbody>${ativasRows}</tbody>
    </table></div>` : `<div class="empty">Nenhuma unidade ativa no momento.</div>`}
    <h2 class="sectiontitle">Feed de alertas <span class="sub">— visão geral, sem filtro por time</span></h2>
    ${all.length ? `<div class="tablewrap"><table>
      <thead><tr><th>Status</th><th>Unidade</th><th>Cliente</th><th>Tipo</th><th>Motivo</th><th>Destino</th><th>Quando</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : `<div class="empty">Nenhum alerta registrado ainda.</div>`}
  `;
}

function openCancelUnidadeModal(id){
  const c = findCase(id);
  g('modalBox').className = 'modal warn-modal';
  g('modalBox').innerHTML = `
    <h3>🛑 Cancelar unidade</h3>
    <p><b>${c.unidade}</b> · ${c.empreendimento} · ${c.cliente}</p>
    <div class="warn-flag">⚠ Ação exclusiva da Administração. Cancela o caso imediatamente, em qualquer etapa (atualmente: ${(MACRO_META[c.macro]||{}).label||c.macro}), avisa a equipe que estava com o caso, e devolve a unidade ao estoque.</div>
    <label>Motivo do cancelamento</label>
    <textarea id="obsText" rows="3" placeholder="Ex: Unidade cancelada por decisão da diretoria — repriorização de portfólio."></textarea>
    <div class="btnrow"><button class="act ghost" onclick="closeModal()">Voltar</button><button class="act danger" onclick="confirmCancelUnidade(${id})">Confirmar cancelamento</button></div>
  `;
  g('modalOverlay').classList.add('show');
}
function confirmCancelUnidade(id){
  const c = findCase(id);
  const motivo = g('obsText').value || 'Sem motivo informado.';
  const prevMacro = c.macro;
  const prevLabel = (MACRO_META[prevMacro]||{}).label || prevMacro;

  logHistory(c, `Unidade cancelada pela Administração — etapa encerrada (estava em: ${prevLabel})`, motivo);
  c.macro = 'cancelado_adm';
  c.subFase = undefined;

  macroToRoles(prevMacro).forEach(role=>{
    ALERTS.push({id: nextAlertId(), caseId:c.id, tipo:'cancelamento_admin', motivo, criadoEm: nowStr(), destino:[role], resolvido:false});
  });

  saveDB(); closeModal(); render();
}

function renderGestorView(){
  const cases = roleCases('relacionamento_gestor');
  const validIds = new Set(cases.map(c=>c.id));
  [...gestorSelectedIds].forEach(id=>{ if(!validIds.has(id)) gestorSelectedIds.delete(id); });

  const rows = cases.map(c=>{
    const opts = ['<option value="">— sem atribuição —</option>'].concat(
      ANALISTAS.map(a=>`<option value="${a}" ${c.analista===a?'selected':''}>${a}</option>`)
    ).join('');
    return `<div class="assignrow" data-caseid="${c.id}" data-search="${searchAttr(c)}">
      <label style="display:flex;align-items:center;gap:9px;flex:1;cursor:pointer">
        <input type="checkbox" class="gestor-chk" data-caseid="${c.id}" ${gestorSelectedIds.has(c.id)?'checked':''} onchange="toggleGestorCheck(${c.id}, this.checked)" style="width:16px;height:16px;cursor:pointer">
        <span class="who"><b class="unid" onclick="event.preventDefault();openDetailModal(${c.id})">${esc(c.unidade)}</b> · ${esc(c.empreendimento)} · ${esc(c.cliente)} <span class="sub">(${esc(c.subFase||'—')} · ${c.dias}d no status)</span></span>
      </label>
      <select class="act" onchange="reassignAnalista(${c.id}, this.value)">${opts}</select>
    </div>`;
  }).join('');

  const porAnalista = ANALISTAS.map(a=>{
    const n = cases.filter(c=>c.analista===a).length;
    return `<div class="kpi"><div class="lbl">${a}</div><div class="val">${n}</div><div class="sla">contatos atribuídos</div></div>`;
  }).join('');

  const analistaOpts = ANALISTAS.map(a=>`<option value="${a}">${a}</option>`).join('');

  return `
    <div class="pagehead">
      <div><h1><img class="navicon" src="icon_relacionamento.png" alt="" onerror="this.outerHTML='🧭'"> Retomada (Gestor)</h1><p>Distribua os casos da esteira (contato inicial e rumo à procuração) entre os analistas conforme sua estratégia. Casos sem atribuição não aparecem para nenhum analista ainda.</p></div>
    </div>
    ${renderKpis('relacionamento_gestor')}
    <h2 class="sectiontitle">Distribuição por analista</h2>
    <div class="kpis">${porAnalista}</div>
    <div class="sectiontitle">
      Todos os contatos em esteira
      <span class="sub">— busque, selecione vários e atribua em lote</span>
    </div>
    <input type="text" id="gestorSearchInput" value="${esc(gestorSearchQuery)}" placeholder="Buscar por unidade, cliente ou empreendimento…" oninput="gestorSearchQuery=this.value; filterAssignRows(this.value)" style="width:100%;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg-raised);color:var(--text);margin-bottom:8px">
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
      <button class="act" onclick="toggleSelectAllGestor(true)">Selecionar visíveis</button>
      <button class="act ghost" onclick="toggleSelectAllGestor(false)">Desmarcar visíveis</button>
      <button class="act ghost" onclick="clearGestorSelection()">🗑 Limpar seleção</button>
      <span id="gestorSelCount" class="sub" style="font-weight:650">${gestorSelectedIds.size} selecionado(s)</span>
      <span style="flex:1"></span>
      <select id="bulkAnalista">${analistaOpts}</select>
      <button class="act primary" onclick="bulkAssignGestor()">Atribuir selecionados</button>
      <button class="act primary" onclick="distribuirAutomatico()">Distribuir automaticamente (sem atribuição)</button>
    </div>
    ${rows || '<div class="empty">Nenhum caso em contato no momento.</div>'}
  `;
}
function filterAssignRows(query){
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.assignrow[data-search]').forEach(row=>{
    const hay = row.getAttribute('data-search')||'';
    row.style.display = (!q || hay.includes(q)) ? '' : 'none';
  });
}
function toggleGestorCheck(id, checked){
  if(checked) gestorSelectedIds.add(id); else gestorSelectedIds.delete(id);
  updateGestorSelCount();
}
function updateGestorSelCount(){
  const el = g('gestorSelCount');
  if(el) el.textContent = gestorSelectedIds.size + ' selecionado(s)';
}
function toggleSelectAllGestor(checked){
  document.querySelectorAll('.assignrow').forEach(row=>{
    if(row.style.display==='none') return;
    const id = Number(row.getAttribute('data-caseid'));
    const cb = row.querySelector('.gestor-chk');
    if(cb) cb.checked = checked;
    if(checked) gestorSelectedIds.add(id); else gestorSelectedIds.delete(id);
  });
  updateGestorSelCount();
}
function clearGestorSelection(){
  gestorSelectedIds.clear();
  document.querySelectorAll('.gestor-chk').forEach(cb=>cb.checked=false);
  updateGestorSelCount();
}
function bulkAssignGestor(){
  const analista = g('bulkAnalista').value;
  const ids = [...gestorSelectedIds];
  if(!ids.length){ showToast('Selecione ao menos um caso.', 'warn'); return; }
  ids.forEach(id=>{
    const c = findCase(id);
    if(!c) return;
    const old = c.analista || '— sem atribuição —';
    c.analista = analista;
    logHistory(c, `Gestor reatribuiu o contato (em lote): ${old} → ${analista}`);
  });
  gestorSelectedIds.clear();
  saveDB(); render();
  showToast(`${ids.length} caso(s) atribuído(s) a ${analista}.`, 'ok');
}

function reassignAnalista(caseId, analista){
  const c = findCase(caseId);
  const old = c.analista || '— sem atribuição —';
  c.analista = analista || null;
  logHistory(c, `Gestor reatribuiu o contato: ${old} → ${analista || '— sem atribuição —'}`);
  saveDB(); render();
}
function distribuirAutomatico(){
  const cases = roleCases('relacionamento_gestor').filter(c=>!c.analista);
  cases.forEach((c,i)=>{
    const analista = ANALISTAS[i % ANALISTAS.length];
    c.analista = analista;
    logHistory(c, `Gestor distribuiu automaticamente: — sem atribuição — → ${analista}`);
  });
  saveDB(); render();
}

function renderRoleView(roleKey){
  const role = ROLES.find(r=>r.key===roleKey);
  let cases = roleCases(roleKey);
  if(roleKey==='relacionamento') cases = cases.filter(c=>c.analista===CURRENT_USER.nome);
  if(roleKey==='vendas') cases = cases.filter(c=>c.vendedor===CURRENT_USER.nome);

  // Bloco "Hoje" — responde "o que eu faço agora?": cards clicáveis que filtram a fila abaixo
  const hojeStr = hojeISO();
  const hjTarefas = cases.filter(c=>(c.tarefas||[]).some(t=>!t.concluida && t.data<=hojeStr));
  const hjParados = cases.filter(c=>c.dias>7);
  const hjAgenda = cases.filter(c=>c.agendamentoData===hojeStr);
  // cls explícito: nem todo n>0 é problema — agendamento marcado é notícia neutra/boa
  const hojeCard = (key, icone, lbl, n, sub, cls)=>`
    <div class="kpi clickable ${hojeFilter===key?'active':''}" onclick="setHojeFilter('${key}')">
      <div class="lbl">${icone} ${lbl}</div>
      <div class="val ${cls!==undefined&&cls!==null?cls:(n>0?'bad':'good')}">${n}</div>
      <div class="sla">${sub}</div>
    </div>`;
  const hojeBlock = `<div class="kpis" style="margin-bottom:24px">
    ${hojeCard('tarefas','⚡','Tarefas pra hoje', hjTarefas.length, 'vencendo ou atrasadas · clique pra isolar')}
    ${hojeCard('parados','⏳','Parados há mais de 7 dias', hjParados.length, 'sem avanço de etapa · clique pra isolar')}
    ${hojeCard('agenda','📅','Agendamentos hoje', hjAgenda.length, 'visitas/assinaturas marcadas · clique pra isolar', hjAgenda.length?'good':'')}
  </div>`;
  if(hojeFilter==='tarefas') cases = hjTarefas;
  else if(hojeFilter==='parados') cases = hjParados;
  else if(hojeFilter==='agenda') cases = hjAgenda;

  const descriptions = {
    relacionamento: 'Contato inicial com o cliente e condução até a procuração ser assinada — mesmo time, do primeiro contato à assinatura. Depois de "Cliente demonstrou interesse", o caso avança pra fase de Recompras (rumo à procuração) sem trocar de fila; assinada a procuração, a unidade fica visível para Vendas.',
    vendas:         'Unidades livres para registrar interesse, e casos com viabilidade em prazo de 24h para serem anexadas.',
    credito:        'Valida o completo e validado. Se não bater com o aprovado, só este interessado cai — a unidade permanece livre.',
    repasse:        'Percorre as fases internas do repasse e confirma o checkbox "Minuta Gerada" quando pronto.',
    distratos:      'Libera a unidade para nova venda após a viabilidade da recompra à vista ser aprovada.',
    contratos:      'Efetua a virada no UAU — Cessão (Transferência Assistida) ou Venda Aprovada (Recompra).',
  };

  let whoami = '';
  let extra = '';
  let tarefasHoje = '';
  if(roleKey==='relacionamento'){
    whoami = `<div class="whoami">Você está logado como <b>${CURRENT_USER.nome} (Analista)</b> — só aparecem contatos atribuídos a você pelo Gestor.</div>`;
    // localStorage pode estar bloqueado (navegação privada/política) — nunca derrubar a view por isso
    let hintFinOk = false; try{ hintFinOk = !!localStorage.getItem('hint_fin_ok'); }catch(e){}
    if(!hintFinOk){
      extra = `<div class="alertbox info"><div class="t">ℹ Dados financeiros do cliente <button class="cefbtn" style="float:right" onclick="try{localStorage.setItem('hint_fin_ok','1')}catch(e){};render()">entendi, ocultar</button></div>Clique no nome de qualquer unidade para consultar data da venda, valor de entrada, financiamento e custas já pagas. O débito atual do cliente ainda não está integrado — consulte o UAU.</div>`;
    }

    const hoje = hojeISO();
    const pendentes = [];
    DB.filter(cc=>cc.analista===CURRENT_USER.nome).forEach(cc=>{
      (cc.tarefas||[]).forEach(t=>{
        if(!t.concluida && t.data<=hoje) pendentes.push({c:cc, t});
      });
    });
    pendentes.sort((a,b)=>(a.t.data+a.t.hora).localeCompare(b.t.data+b.t.hora));
    if(pendentes.length){
      const rows = pendentes.map(({c:cc,t})=>{
        const atrasada = t.data<hoje;
        return `<div class="alertrow" style="border-color:${atrasada?'var(--warn)':'var(--info)'}">
          <div class="info"><b>${cc.unidade} · ${cc.cliente}</b><div class="m">${esc(t.tipo)} — ${t.data} ${t.hora}${atrasada?' (atrasada)':''}${t.obs?` · ${esc(t.obs)}`:''}</div></div>
          <div class="btns"><button class="act" onclick="toggleTarefa(${cc.id}, ${t.id})">Concluir</button><button class="act ghost" onclick="openDetailModal(${cc.id})">Ver caso</button></div>
        </div>`;
      }).join('');
      tarefasHoje = `<h2 class="sectiontitle">📋 Tarefas de hoje (ou atrasadas)</h2>${rows}`;
    }
  }

  let vendasExtra = '';
  if(roleKey==='vendas'){
    const minhasVendas = DB.filter(c=>c.vendedor===CURRENT_USER.nome);
    vendasExtra = `
      <h2 class="sectiontitle">Minhas vendas <span class="sub">— todas as unidades que você vendeu, em qualquer estágio atual. Depois de anexar a viabilidade, você não altera mais a etapa — só pode sinalizar risco de distrato.</span></h2>
      ${renderMinhasVendasTable(minhasVendas, 'tblMinhasVendas')}
    `;
  }

  const alertsHtml = renderRoleAlerts(roleKey);

  const catalog = roleBoardCatalog(roleKey);
  const vm = roleViewMode[roleKey] || 'list';
  const toggle = catalog ? `<div class="viewtoggle">
      <button class="vtbtn ${vm==='list'?'active':''}" onclick="setRoleViewMode('${roleKey}','list')">📋 Lista</button>
      <button class="vtbtn ${vm==='board'?'active':''}" onclick="setRoleViewMode('${roleKey}','board')">🗂️ Quadro</button>
    </div>` : '';

  const addBtn = roleKey==='relacionamento' ? `<button class="act primary" onclick="openAddUnidadeModal()">➕ Adicionar unidade</button>` : '';
  return `
    <div class="pagehead">
      <div><h1>${roleIcon(role)} ${role.label}</h1><p>${descriptions[roleKey]||''}</p></div>
      <div style="display:flex;gap:8px;align-items:center">
        ${toggle}
        ${addBtn}
      </div>
    </div>
    ${whoami}
    ${hojeBlock}
    ${renderKpis(roleKey)}
    ${alertsHtml}
    ${tarefasHoje}
    ${extra}
    <h2 class="sectiontitle">${roleKey==='vendas' ? 'Ações pendentes' : 'Casos ativos'} <span class="sub">— ordenado por urgência (tarefa atrasada, prazo vencendo, tempo parado)</span></h2>
    ${catalog && vm==='board' ? renderSubFaseBoard(cases, catalog) : renderTable(cases, 'tblRole')}
    ${vendasExtra}
  `;
}

// ───────────────────────── Busca e exportação (genérico p/ qualquer tabela) ─────────────────────────
function searchAttr(c){
  return esc(`${c.unidade} ${c.empreendimento} ${c.cliente} ${c.analista||''}`.toLowerCase());
}
function tableToolbar(tid, cases){
  const subFases = cases ? [...new Set(cases.map(c=>c.subFase).filter(Boolean))] : [];
  const subFaseFilter = subFases.length ? `<select id="${tid}SubFaseFilter" onchange="applyTableFilter('${tid}')" title="Filtrar por fase — ver o que está parado em qual etapa">
      <option value="">Todas as fases</option>
      ${subFases.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}
    </select>` : '';
  return `<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap">
    <input type="text" id="${tid}SearchInput" placeholder="Buscar por unidade, cliente, empreendimento ou analista…" oninput="applyTableFilter('${tid}')" style="flex:1;min-width:180px;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg-raised);color:var(--text)">
    ${subFaseFilter}
    <span id="${tid}Count" class="sub" style="white-space:nowrap"></span>
    <button class="act" onclick="exportTableCSV('${tid}')">⬇ Exportar CSV</button>
  </div>`;
}
// Filtro combinado (busca de texto + fase) — os dois convivem, cada linha carrega data-search e data-subfase.
// O estado fica em tableFilterState pra sobreviver aos re-renders (toda ação reconstrói o HTML).
const tableFilterState = {};
function applyTableFilter(tid){
  const table = g(tid);
  if(!table) return;
  const searchEl = g(tid+'SearchInput');
  const subFaseEl = g(tid+'SubFaseFilter');
  const q = searchEl ? searchEl.value.toLowerCase().trim() : '';
  const sf = subFaseEl ? subFaseEl.value : '';
  tableFilterState[tid] = {q: searchEl ? searchEl.value : '', sf};
  let visible = 0, total = 0;
  table.querySelectorAll('tbody tr[data-search]').forEach(tr=>{
    const hay = tr.getAttribute('data-search')||'';
    const rowSf = tr.getAttribute('data-subfase')||'';
    const show = (!q || hay.includes(q)) && (!sf || rowSf===sf);
    tr.style.display = show ? '' : 'none';
    total++; if(show) visible++;
  });
  const countEl = g(tid+'Count');
  if(countEl) countEl.textContent = (q||sf) ? `${visible} de ${total}` : `${total}`;
}
// Reaplica busca + filtro de fase que o usuário tinha antes do re-render
function restoreTableFilter(tid){
  const st = tableFilterState[tid];
  if(!g(tid)) return;
  const searchEl = g(tid+'SearchInput');
  const subFaseEl = g(tid+'SubFaseFilter');
  if(st){
    if(searchEl) searchEl.value = st.q;
    if(subFaseEl) subFaseEl.value = st.sf;
  }
  applyTableFilter(tid);
}
function exportTableCSV(tid){
  const table = g(tid);
  if(!table) return;
  const rows = [...table.querySelectorAll('tbody tr[data-caseid]')].filter(tr=>tr.style.display!=='none');
  if(!rows.length){ showToast('Nada para exportar (verifique o filtro de busca).', 'warn'); return; }
  const header = ['Unidade','Empreendimento','Cliente','Valor','Status','Sub-fase','Dias'];
  const data = rows.map(tr=>{
    const c = findCase(Number(tr.getAttribute('data-caseid')));
    return [c.unidade, c.empreendimento, c.cliente, c.valor, caseMacroLabel(c), c.subFase||'', c.dias];
  });
  const csv = [header, ...data].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'esteira_'+tid+'_'+hojeISO()+'.csv';
  a.click(); URL.revokeObjectURL(url);
}

function renderTable(cases, tid){
  tid = tid || 'tblGeneric';
  if(!cases.length) return `<div class="empty">Nenhum caso nesta etapa no momento.</div>`;
  const rows = cases.map(c=>renderRow(c)).join('');
  return `${tableToolbar(tid, cases)}<div class="tablewrap"><table id="${tid}">
    <thead><tr><th>Unidade</th><th>Cliente</th><th>Braço</th><th>Status</th><th>Dias</th><th>Próxima tarefa</th><th class="num">Ações</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderMinhasVendasTable(cases, tid){
  tid = tid || 'tblVendas';
  if(!cases.length) return `<div class="empty">Nenhuma venda registrada ainda.</div>`;
  const rows = cases.map(c=>{
    const podeSinalizar = !['concluido','encerrado','resolvido_cef','distratado','cancelado_adm'].includes(c.macro);
    return `<tr data-caseid="${c.id}" data-search="${searchAttr(c)}" data-subfase="${esc(c.subFase||'')}">
      <td><div class="unid" title="Ver detalhes" onclick="openDetailModal(${c.id})">${esc(c.unidade)}</div><div class="sub">${esc(c.empreendimento)} · ${fmtMoney(c.valor)}</div></td>
      <td>${esc(c.cliente)}</td>
      <td>${bracoLabel(c.braco)}</td>
      <td>${caseBadge(c)}</td>
      <td><span class="dias ${c.dias>=8?'late':(c.dias>=5?'warm':'')}">${c.dias}d</span></td>
      <td>${renderTarefaCell(c)}</td>
      <td class="num">${podeSinalizar ? `<button class="act danger" onclick="openSinalizarDistratoModal(${c.id})">Comunicar risco de distrato</button>` : `<span class="sub">—</span>`}</td>
    </tr>`;
  }).join('');
  return `${tableToolbar(tid, cases)}<div class="tablewrap"><table id="${tid}">
    <thead><tr><th>Unidade</th><th>Cliente</th><th>Braço</th><th>Status atual</th><th>Dias</th><th>Próxima tarefa</th><th class="num">Ação</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function nextTarefaInfo(c){
  // próximo compromisso = tarefa pendente mais próxima OU agendamento de Recompras, o que vier antes
  const pend = (c.tarefas||[]).filter(t=>!t.concluida).map(t=>({tipo:t.tipo, data:t.data, hora:t.hora||''}));
  if(c.macro==='recompras' && c.agendamentoData) pend.push({tipo:'Agendamento', data:c.agendamentoData, hora:c.agendamentoHora||''});
  if(!pend.length) return null;
  const t = pend.sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora))[0];
  const hoje = hojeISO();
  const diff = Math.round((new Date(t.data+'T00:00:00') - new Date(hoje+'T00:00:00'))/86400000);
  const rel = diff===0 ? 'hoje' : (diff>0 ? `+${diff}d` : `${diff}d`);
  return {tipo:t.tipo, rel, atrasada: diff<0};
}
function renderTarefaCell(c){
  const info = nextTarefaInfo(c);
  if(!info) return `<span class="sub">—</span>`;
  return `<div class="nexttask ${info.atrasada?'late':''}"><div class="nt-tipo">${esc(info.tipo)}</div><div class="nt-rel">${info.rel}</div></div>`;
}
function renderRow(c){
  const late = c.dias >= 8;
  const a = renderActions(c);
  // Status: quando a etapa tem fases, o próprio seletor vive aqui (muda direto na coluna);
  // senão, mostra o badge da etapa. O badge de macro sai quando há seletor — menos ruído.
  const statusCell = a.select ? a.select : caseBadge(c);
  // "Ver detalhes" saiu: o nome da unidade já abre a ficha (agora com affordance permanente) —
  // a coluna redundante só roubava largura. esc() em tudo que vem do banco/digitação.
  return `<tr data-caseid="${c.id}" data-search="${searchAttr(c)}" data-subfase="${esc(c.subFase||'')}">
    <td><div class="unid" title="Ver detalhes" onclick="openDetailModal(${c.id})">${esc(c.unidade)}</div><div class="sub">${esc(c.empreendimento)} · ${fmtMoney(c.valor)}</div></td>
    <td>${esc(caseDisplayCliente(c))}${c.vendedor?`<div class="sub">Vendedor: ${esc(c.vendedor)}</div>`:''}${c.analista?`<div class="sub">Analista: ${esc(c.analista)}</div>`:''}</td>
    <td>${bracoLabel(c.braco)}</td>
    <td>${statusCell}</td>
    <td><span class="dias ${late?'late':(c.dias>=5?'warm':'')}">${c.dias}d</span></td>
    <td>${renderTarefaCell(c)}</td>
    <td>${renderActionsCell(c, a)}</td>
  </tr>`;
}

const RELAC_FASE_INICIAL = '— Aguardando 1º contato';
const RELAC_FASES = [RELAC_FASE_INICIAL, 'TENTANDO CONTATO','CONVERSANDO'];
const RECOMPRAS_FASES = ['EM CONTATO','PRÉ-AGENDAMENTO','AGENDADO'];
function subFaseSelect(c, catalog){
  const opts = catalog.map(s=>`<option value="${s}" ${c.subFase===s?'selected':''}>${s}</option>`).join('');
  return `<select class="act" style="cursor:pointer" onchange="changeSubFase(${c.id}, this.value)">${opts}</select>`;
}
// renderActions/renderFaseActions retornam {select, primary, secondary:[{label,onclick,danger}]}
// — a ação principal fica visível na linha, as secundárias (recusa, sem contato, reprovar...) vão pro menu "⋯"
function renderActions(c){
  switch(c.macro){
    case 'relacionamento':
      // "Cliente demonstrou interesse" saiu da linha — vive no topo do painel de detalhe
      // e do modal de Adicionar registro, contextual à fase (evita clique errado em massa)
      return {
        select: subFaseSelect(c, RELAC_FASES),
        primary: `<button class="act primary" onclick="openAddRegistroModal(${c.id})">+ Adicionar registro</button>`,
        secondary: [
          {label:'Recusa a seguir', onclick:`openObsModal(${c.id}, 'recusa_seguir')`, danger:true},
          {label:'Sem contato', onclick:`openObsModal(${c.id}, 'sem_contato')`, danger:true},
        ],
      };
    case 'recompras':
      return {
        select: subFaseSelect(c, RECOMPRAS_FASES),
        primary: `<button class="act primary" onclick="openAddRegistroModal(${c.id})">+ Adicionar registro</button>`,
        secondary: [],
      };
    case 'vendas_livre':
      return { select:'', primary:`<button class="act primary" onclick="openObsModal(${c.id}, 'registrar_interesse')">Registrar interesse</button>`, secondary:[] };
    case 'viabilidade':
      return { select:'', primary:`<button class="act primary" onclick="openViabilidadeModal(${c.id})">Calcular viabilidade</button>`, secondary:[] };
    case 'aprovacao_comercial':
      return {
        select:'',
        primary:`<button class="act primary" onclick="openObsModal(${c.id}, 'aprovacao_comercial')">Aprovação Comercial concluída</button>`,
        secondary:[{label:'Rever cálculo / gerar novo PDF', onclick:`openViabilidadeModal(${c.id})`}],
      };
    case 'credito':
      return {
        select:'',
        primary:`<button class="act primary" onclick="openObsModal(${c.id}, 'credito_aprova')">Aprovar completo e validado</button>`,
        secondary:[{label:'Reprovar', onclick:`openObsModal(${c.id}, 'credito_reprova')`, danger:true}],
      };
    case 'repasse':
      // Recompra direta não é conduzida pelo app — nada de dropdown de fase (catálogo fixo não
      // cobre os valores brutos vindos da planilha) nem botão de ação; só espelha o status real
      // (caseBadge já mostra a coluna 28 pra esses casos).
      if(c.recompraDireta) return { select:'', primary:'', secondary:[] };
      return renderFaseActions(c);
    case 'contratos_cessao':
      return { select:'', primary:`<button class="act primary" onclick="openObsModal(${c.id}, 'cessao_uau')">Confirmar Cessão no UAU</button>`, secondary:[] };
    case 'distratos':
      return { select:'', primary:`<button class="act primary" onclick="openObsModal(${c.id}, 'liberar_unidade')">Liberar unidade</button>`, secondary:[] };
    case 'contratos_recompra':
      // Recompra direta também não conduz essa etapa pelo app — a venda é tratada por fora
      // (planilhas/UAU direto pelo time), sem clique de confirmação aqui. Só espelha o status.
      if(c.recompraDireta) return { select:'', primary:'', secondary:[] };
      return { select:'', primary:`<button class="act primary" onclick="openObsModal(${c.id}, 'recompra_uau')">Confirmar Venda no UAU</button>`, secondary:[] };
    default:
      return { select:'', primary:'', secondary:[] };
  }
}

function renderFaseActions(c){
  const select = subFaseSelect(c, FASES_CATALOGO);
  const primary = !c.minutaGerada
    ? `<button class="act primary" onclick="openMinutaModal(${c.id})">Marcar Minuta Gerada</button>`
    : `<button class="act primary" onclick="openObsModal(${c.id}, 'assinatura_presencial')">Cliente assinou (presencial)</button>`;
  return { select, primary, secondary: [] };
}
// Monta a célula de ações: seletor de fase + botão principal sempre visíveis; o resto (ações
// secundárias/perigosas + "Cliente pagou CEF") entra num menu "⋯" — evita a fileira de botões
// quebrando linha que deixava a tabela poluída.
function renderActionsCell(c, a){
  a = a || renderActions(c);
  const canCef = !['concluido','encerrado','resolvido_cef','distratado','cancelado_adm'].includes(c.macro);
  const secondary = [...a.secondary];
  if(canCef) secondary.push({label:'Cliente pagou CEF', onclick:`openCefModal(${c.id})`});
  const menu = secondary.length ? `<div class="menuwrap">
      <button class="act ghost menubtn" onclick="toggleRowMenu(event, ${c.id})" title="Mais ações">⋯</button>
      <div class="rowmenu" id="rowmenu-${c.id}">
        ${secondary.map(s=>`<button class="${s.danger?'danger':''}" onclick="closeRowMenus();${s.onclick}">${esc(s.label)}</button>`).join('')}
      </div>
    </div>` : '';
  return `<div class="actions">${a.primary||''}${menu}</div>`;
}
function toggleRowMenu(ev, id){
  ev.stopPropagation();
  const menu = g('rowmenu-'+id);
  if(!menu) return;
  const wasOpen = menu.classList.contains('show');
  closeRowMenus();
  if(!wasOpen){
    menu.classList.add('show');
    // Fecha no primeiro scroll (captura pega também o scroll interno de .tablewrap.tall) —
    // um menu fixed que não acompanha a rolagem ficaria pairando sobre a linha errada.
    window.addEventListener('scroll', closeRowMenus, {capture:true, once:true});
    // position:fixed medido do botão — escapa do overflow do .tablewrap, que clipava o menu
    // nas últimas linhas (overflow-y:visible é inócuo quando overflow-x é auto, por spec).
    const r = ev.currentTarget.getBoundingClientRect();
    menu.style.position = 'fixed';
    menu.style.top = (r.bottom + 4) + 'px';
    menu.style.right = (document.documentElement.clientWidth - r.right) + 'px';
  }
}
function closeRowMenus(){
  document.querySelectorAll('.rowmenu.show').forEach(m=>{
    m.classList.remove('show');
    m.style.position = m.style.top = m.style.right = '';
  });
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.menuwrap')) closeRowMenus();
});

function changeSubFase(id, val){
  const c = findCase(id);
  // Pré-agendamento/Agendado precisam de uma data — abre modal em vez de aplicar direto,
  // pra alimentar a Agenda (visão de agendamentos futuros do time)
  if(c.macro==='recompras' && (val==='PRÉ-AGENDAMENTO' || val==='AGENDADO')){
    openAgendamentoModal(id, val);
    return;
  }
  applySubFaseChange(id, val);
}
function applySubFaseChange(id, val){
  const c = findCase(id);
  const old = c.subFase;
  c.subFase = val;
  logHistory(c, `Fase alterada: ${old||'—'} → ${val}`);
  saveDB(); render();
}
function openAgendamentoModal(id, val){
  const c = findCase(id);
  const hoje = hojeISO();
  g('modalBox').className = 'modal';
  g('modalBox').innerHTML = `
    <h3>📅 ${val==='AGENDADO' ? 'Confirmar data do agendamento' : 'Data prevista do pré-agendamento'}</h3>
    <p><b>${c.unidade}</b> · ${c.empreendimento} · ${c.cliente}</p>
    <label>Data</label>
    <input type="date" id="agendaData" value="${c.agendamentoData||hoje}" min="${hoje}">
    <label>Hora (opcional)</label>
    <input type="time" id="agendaHora" value="${c.agendamentoHora||''}">
    <div class="btnrow"><button class="act ghost" onclick="closeModal();render()">Cancelar</button><button class="act primary" onclick="confirmAgendamento(${id}, '${val}')">Confirmar</button></div>
  `;
  g('modalOverlay').classList.add('show');
}
function confirmAgendamento(id, val){
  const data = g('agendaData').value;
  if(!data){ showToast('Selecione uma data.', 'warn'); return; }
  const hora = g('agendaHora') ? g('agendaHora').value : '';
  const c = findCase(id);
  c.agendamentoData = data;
  c.agendamentoHora = hora || undefined;
  applySubFaseChange(id, val);
  closeModal();
  showToast('Agendamento salvo — visível na Agenda.', 'ok');
}

// ───────────────────────── Modal: histórico / documentos / financeiro ─────────────────────────
function openDetailModal(id){
  detailTab = 'atividades';
  // Só abre o overlay se a ficha realmente renderizou — senão o painel abriria vazio ou
  // mostrando o ÚLTIMO modal renderizado (caso errado) quando o id não existe mais no DB.
  if(renderDetailModal(id)) g('modalOverlay').classList.add('show','panel-mode');
}
function switchDetailTab(id, tab){ detailTab = tab; renderDetailModal(id); }
// Botão de avanço de etapa — some da tabela e do menu; agora só aparece no topo do
// painel de detalhe e do modal de Adicionar registro, contextual à fase do caso.
function stageActionButtonHtml(c){
  if(c.macro==='relacionamento') return `<button class="act primary" style="width:100%" onclick="openObsModal(${c.id}, 'interesse')">Cliente demonstrou interesse</button>`;
  if(c.macro==='recompras'){
    // Três motivos possíveis pra um caso estar em "Recompras", cada um com ação e destino
    // diferentes: braco='recompra' é a Transferência Assistida que caiu pra recompra depois da
    // Aprovação Comercial à vista; procuracaoVencida é a procuração que venceu sem comprador e
    // precisa reaprovar viabilidade; senão, é a procuração original rumo à primeira assinatura.
    if(c.procuracaoVencida) return `<button class="act primary" style="width:100%" onclick="openObsModal(${c.id}, 'aprova_recompra_vencida')">✅ Aprovar recompra — liberar pra Distratos</button>`;
    if(c.braco==='recompra') return `<button class="act primary" style="width:100%" onclick="openObsModal(${c.id}, 'recompra_concluida')">Recompra concluída</button>`;
    // "Recompra direta" — marcada à mão na unidade (não é Transferência Assistida): assinada a
    // procuração, a Metrocasa já corre pra recomprar de verdade, sem tentar achar comprador
    // primeiro. Pula Vendas Livre/Viabilidade inteiros e vai reto pra Distratos liberar o estoque.
    const toggleRecompra = podeEditarCustas() ? `<label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12.5px;cursor:pointer;color:var(--muted)">
        <input type="checkbox" ${c.recompraDireta?'checked':''} onchange="toggleRecompraDireta(${c.id}, this.checked)" style="width:16px;height:16px;cursor:pointer">
        <span>🔁 Recompra direta — pula negociação, vai reto pro estoque quando a procuração for assinada</span>
      </label>` : (c.recompraDireta ? `<div class="sub" style="margin-bottom:8px">🔁 Marcada como recompra direta</div>` : '');
    return toggleRecompra + `<button class="act primary" style="width:100%" onclick="openObsModal(${c.id}, 'procuracao')">Procuração assinada</button>`;
  }
  return '';
}
function renderDetailModal(id){
  const c = findCase(id);
  if(!c){ showToast('Caso não encontrado.', 'warn'); closeModal(); return false; }
  g('modalOverlay').classList.add('panel-mode');
  g('modalBox').className = 'modal panel';
  const tabs = [{key:'atividades', label:'📋 Atividades'},{key:'documentos', label:'📎 Documentos'},{key:'financeiro', label:'💰 Financeiro'}];
  const tabBtns = tabs.map(t=>`<button class="tabbtn ${detailTab===t.key?'active':''}" onclick="switchDetailTab(${id},'${t.key}')">${t.label}</button>`).join('');
  let panel = '';
  if(detailTab==='atividades') panel = renderAtividadesPanel(c);
  else if(detailTab==='documentos') panel = renderDocumentosPanel(c);
  else if(detailTab==='financeiro') panel = renderFinanceiroPanel(c);
  const stageBtn = stageActionButtonHtml(c);

// Anexos: sobem pro Storage do Supabase quando online; offline (ou sem bucket configurado ainda)
// caem pra data URI local, guardada só no cache do navegador — nunca se perde o clique, mas
// avisa quando não sincronizou de verdade pra nuvem.
const ANEXOS_BUCKET = 'anexos';
const ANEXOS_MAX_TOTAL = 8 * 1024 * 1024; // 8MB por registro
function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function processAnexos(caseId, fileList){
  const files = Array.from(fileList||[]);
  if(!files.length) return [];
  const total = files.reduce((s,f)=>s+f.size,0);
  if(total > ANEXOS_MAX_TOTAL){
    showToast('Anexos somam mais de 8MB — remova algum arquivo antes de adicionar.', 'warn');
    return null;
  }
  const out = [];
  let algumLocal = false;
  for(const f of files){
    let subiu = false;
    if(supa && supabaseOnline){
      try{
        // O Storage do Supabase rejeita chave com acento ("Invalid key") — só trocar espaço por
        // "_" não bastava pra nome tipo "RELAÇÃO...MÉDIAS...pdf". semAcento() tira o acento, e o
        // replace troca qualquer caractere que ainda sobrar fora de [a-zA-Z0-9._-] por "_". O
        // nome ORIGINAL (com acento) continua guardado em f.name pra exibição — só o path muda.
        const nomeArquivoSeguro = semAcento(f.name).replace(/\s+/g,'_').replace(/[^a-zA-Z0-9._-]/g,'_');
        const path = `${caseId}/${Date.now()}-${nomeArquivoSeguro}`;
        const {error} = await supa.storage.from(ANEXOS_BUCKET).upload(path, f, {upsert:false});
        if(error) throw error;
        // Bucket é privado — não guarda URL pública (nem existe mais). Guarda só o caminho; o link
        // de verdade é gerado na hora de abrir (createSignedUrl, ver abrirAnexo/renderAnexosChips).
        out.push({name:f.name, path, type:f.type, size:f.size});
        subiu = true;
      }catch(e){
        console.warn('Falha ao subir anexo pro Supabase — salvando só localmente', e);
      }
    }
    if(!subiu){
      out.push({name:f.name, url: await fileToDataUrl(f), type:f.type, size:f.size, local:true});
      algumLocal = true;
    }
  }
  if(algumLocal) showToast('Anexo salvo só neste navegador — Supabase Storage indisponível ou bucket "anexos" não configurado ainda.', 'warn');
  return out;
}
// Caminho de storage de um anexo — direto (uploads novos, campo "path") ou extraído da URL pública
// antiga (registros de antes do bucket virar privado, ver supabase-anexos-privado.sql). Sem isso,
// anexo antigo nenhum abriria mais depois da migração.
function anexoPath(a){
  if(a.path) return a.path;
  if(a.url && a.url.includes('/object/public/anexos/')) return a.url.split('/object/public/anexos/')[1];
  return null;
}
// Abre um anexo do Storage — gera um link assinado válido por 1h na hora do clique (o bucket é
// privado, não existe mais link fixo que funcione pra sempre).
async function abrirAnexo(e, path){
  if(e) e.preventDefault();
  if(!supa){ showToast('Sem conexão com o Supabase — não consigo abrir esse anexo agora.', 'warn'); return; }
  const {data, error} = await supa.storage.from(ANEXOS_BUCKET).createSignedUrl(path, 3600);
  if(error || !data){ showToast('Não consegui abrir esse anexo — tente de novo.', 'warn'); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}
// Carrega as miniaturas de imagem de forma preguiçosa (assíncrona) depois que os chips já estão na
// tela — cada uma pede seu próprio link assinado, já que não dá pra colocar direto no src como antes.
async function carregarThumbsAnexos(){
  if(!supa) return;
  for(const el of document.querySelectorAll('.anexo-lazyimg[data-path]')){
    const path = el.getAttribute('data-path');
    el.removeAttribute('data-path');
    try{
      const {data, error} = await supa.storage.from(ANEXOS_BUCKET).createSignedUrl(path, 3600);
      if(!error && data) el.innerHTML = `<img src="${data.signedUrl}" alt="">`;
    }catch(e){}
  }
}
function renderAnexosChips(anexos){
  if(!anexos || !anexos.length) return '';
  const chips = anexos.map(a=>{
    const isImg = (a.type||'').startsWith('image/');
    // Fallback local (base64, salvo só neste navegador) — sempre abre direto, não passa pelo Storage.
    if(a.local){
      return isImg
        ? `<a href="${a.url}" target="_blank" rel="noopener" class="anexo-thumb" title="${esc(a.name)}"><img src="${a.url}" alt=""></a>`
        : `<a href="${a.url}" target="_blank" rel="noopener" class="anexo-chip" title="${esc(a.name)}">📎 ${esc(a.name)}</a>`;
    }
    const path = anexoPath(a);
    if(!path){
      // Sem caminho reconhecível (registro muito antigo) — melhor esforço, mantém o link como veio.
      return isImg
        ? `<a href="${a.url}" target="_blank" rel="noopener" class="anexo-thumb" title="${esc(a.name)}"><img src="${a.url}" alt=""></a>`
        : `<a href="${a.url}" target="_blank" rel="noopener" class="anexo-chip" title="${esc(a.name)}">📎 ${esc(a.name)}</a>`;
    }
    return isImg
      ? `<a href="#" onclick="abrirAnexo(event,'${esc(path)}')" class="anexo-thumb anexo-lazyimg" data-path="${esc(path)}" title="${esc(a.name)}">🖼️</a>`
      : `<a href="#" onclick="abrirAnexo(event,'${esc(path)}')" class="anexo-chip" title="${esc(a.name)}">📎 ${esc(a.name)}</a>`;
  }).join('');
  setTimeout(carregarThumbsAnexos, 0); // depois do innerHTML entrar no DOM
  return `<div class="anexos-row">${chips}</div>`;
}

function lookupEmolumentoFiduciario(valor){
  for(const row of EMOLUMENTO_FIDUCIARIA_TABELA){ if(valor <= row.limite) return row.valor; }
  // acima do teto da tabela (nenhuma faixa maior) — usa o último valor conhecido

function calcEmolumentoFiduciariaRevenda(valorVenda){
  return round2(lookupEmolumentoFiduciario(valorVenda) + lookupEmolumentoFiduciario(valorVenda*0.8));
}
// = (metragem × R$15) × (meses restantes até o habite-se) — projeção de cotas condominiais até a entrega.
// Precisa da área (m²) da unidade, que não vem da base — por isso é um campo digitado à parte (c.metragemM2).
function calcCondominioAteEntrega(c){
  const key = (c.empreendimento||'').trim().toUpperCase();
  const dataHabite = HABITE_SE_NORM[key];
  const metragem = c.metragemM2 || 0;
  if(!dataHabite || !metragem) return 0;
  const meses = (new Date(dataHabite+'T00:00:00') - new Date()) / 86400000 / 30;
  return meses > 0 ? round2(metragem * 15 * meses) : 0;
}

  {id:12, desc:'TCCAV — Tarifa de Cobertura de Custos à Vista',                       sinal:-1, tipo:'fixo', fixo:300, abrev:'TCCAV'},
  {id:13, desc:'ITBI — Revenda (teto R$120.968 × 0,5% + diferença × 3%)',             sinal:-1, tipo:'itbiRevenda', abrev:'ITBI\nRevenda'},
  {id:14, desc:'Emolumentos — registro da escritura fiduciária (revenda)',            sinal:-1, tipo:'emolFiduciariaRevenda', abrev:'Emol. fid.\nRevenda'},
  {id:15, desc:'Reparos de unidade',                                                  sinal:-1, tipo:'custafield', field:'reparo', obrigatorio:true, abrev:'Reparos'},
  {id:16, desc:'Restituição de valores pagos pelo cliente',                           sinal:-1, tipo:'custafield', field:'restituicao', obrigatorio:true, abrev:'Restituição'},
];
// Campos que precisam estar confirmados (mesmo que o valor seja R$0) antes da unidade seguir pra Vendas.
const VIAB_REQUIRED_IDS = VIAB_ITEMS.filter(it=>it.obrigatorio).map(it=>it.id);
// Antes, cada campo obrigatório (Quitação CEF/Reparos/Restituição) precisava de um override
// individual dentro da própria Viabilidade — clicar e confirmar, mesmo que o valor real fosse
// R$0. Agora esses campos não são mais editáveis ali (só puxam de "Custas — Cadastro"), então a
// confirmação virou "essa unidade tem custas cadastradas" em vez de um clique item a item.
function viabCamposFaltando(c){
  const temCustas = !!(getCustasPagas(c) || getCustasProj(c));
  return temCustas ? [] : VIAB_REQUIRED_IDS.map(id => VIAB_ITEMS.find(it=>it.id===id).desc);
}
function viabValorVenda(c){
  return (c.financeiro && c.financeiro.vendaNova && c.financeiro.vendaNova.valorNegociado) || c.valor || 0;
}
function buildViabilidadeValues(c){
  // As duas planilhas coexistem por chave: CUSTAS_PROJ tem os campos projetados da venda nova
  // (laudo/condomínio/remuneração), CUSTAS_PAGAS tem o que já foi realmente pago/apurado (ex:
  // quitação CEF). Pegar só um objeto inteiro (ex: só CUSTAS_PROJ por existir a chave) zerava
  // campos que só estão preenchidos no outro — por isso o fallback é CAMPO A CAMPO, não por objeto.
  const custasProj = getCustasProj(c) || {};
  const custasPagas = getCustasPagas(c) || {};
  // "Recompra Futura" (RECOMPRA_FUTURA_UNITS) não cai pro fallback de CUSTAS_PAGAS — ainda não é
  // recompra de verdade, não existe custo "já pago" real pra misturar aqui.
  const ehRecompraFutura = c.chave && RECOMPRA_FUTURA_UNITS.has(c.chave);
  const custaField = field => custasProj[field] || (ehRecompraFutura ? 0 : custasPagas[field]) || 0;
  const valorVenda = viabValorVenda(c);
  const overrides = c.viabOverrides || {};
  const values = {};
  // Duas passadas: itens "calc" referenciam o valor de OUTRO item (ex: item 3 é 4% do item 5),
  // mas VIAB_ITEMS segue a numeração da planilha original, não a ordem de dependência — o item 3
  // vem ANTES do item 5 na lista. Calcular tudo numa passada só (ordem do array) fazia esse tipo
  // de referência "pra frente" sempre dar 0, porque o valor referenciado ainda não existia em
  // `values` na hora. Resolve calculando primeiro todo mundo que NÃO depende de outro item, e só
  // depois os "calc" — que aí já encontram qualquer base (seja ela item 1 ou item 15) pronta.
  VIAB_ITEMS.filter(it=>it.tipo!=='calc').forEach(it=>{
    // Só o item marcado editavel:true (hoje, só o Novo Valor de Venda) aceita override — todo o
    // resto vem sempre de Custas — Cadastro/fórmula, nunca de um valor digitado na Viabilidade.
    if(it.editavel && overrides[it.id] !== undefined){ values[it.id] = overrides[it.id]; return; }
    let v = 0;
    if(it.tipo==='venda') v = valorVenda;
    else if(it.tipo==='custafield') v = custaField(it.field);
    else if(it.tipo==='fixo') v = it.fixo;
    else if(it.tipo==='itbiRevenda') v = calcItbiRevenda(valorVenda);
    else if(it.tipo==='emolFiduciariaRevenda') v = calcEmolumentoFiduciariaRevenda(valorVenda);
    else if(it.tipo==='condominio') v = calcCondominioAteEntrega(c);
    values[it.id] = round2(v);
  });
  VIAB_ITEMS.filter(it=>it.tipo==='calc').forEach(it=>{
    if(it.editavel && overrides[it.id] !== undefined){ values[it.id] = overrides[it.id]; return; }
    values[it.id] = round2(Math.abs(values[it.base]||0) * (it.pct/100));
  });
  return values;
}
function totalViabilidade(values){
  return round2(VIAB_ITEMS.reduce((s,it)=>s + (it.sinal===1?values[it.id]:-values[it.id]), 0));
}
// Classificação padrão de viabilidade (rótulos e limiares em UM lugar só — usada no
// badge da ficha, no PDF individual, na capa e na análise em lote).
function viabClassificacao(total){
  const cfg = VIAB_CONFIG;
  if(total < cfg.thMin) return {key:'inviavel', icon:'✗', label:'Inviável', desc:`Lucro abaixo de ${fmtMoney(cfg.thMin)}`, cls:'warn'};
  if(total < cfg.thAlert) return {key:'atencao', icon:'⚠', label:'Atenção', desc:`Entre ${fmtMoney(cfg.thMin)} e ${fmtMoney(cfg.thAlert)}`, cls:'warn'};
  return {key:'aprovado', icon:'✓', label:'Pré aprovado', desc:`Lucro acima de ${fmtMoney(cfg.thAlert)}`, cls:'ok'};
}
function podeEditarCustas(){
  return CURRENT_USER && (CURRENT_USER.perfil==='admin' || CURRENT_USER.perfil==='relacionamento' || CURRENT_USER.perfil==='relacionamento_gestor');

// Venda" na Viabilidade (é o próprio negócio que ela está fechando com o comprador).
function podeEditarNovoValorVenda(){

}
function updateMetragem(caseId, val){

// O toggle de recompra direta vive no botão de avanço de etapa (stageActionButtonHtml), que
// aparece tanto no painel de detalhe quanto no modal "Adicionar registro" — reabre o que estava
// aberto, sem chutar pro dashboard nem perder a rolagem do painel.
function toggleRecompraDireta(caseId, checked){
  const c = findCase(caseId);
  c.recompraDireta = checked;
  logHistory(c, checked
    ? '🔁 Marcada como recompra direta — quando a procuração for assinada, vai reto pra Distratos (sem passar por Vendas Livre/Viabilidade)'
    : '🔁 Desmarcada como recompra direta — procuração assinada volta a seguir pro fluxo normal (Vendas Livre)', null);

// Reabre a aba Financeiro sem chutar a rolagem de volta pro topo — editar um item de custas fica
// lá embaixo na tabela, e antes cada edição te devolvia pro início da tela (renderDetailModal troca
// o innerHTML inteiro do painel). Guarda a posição do painel rolável (.tabpanel) e restaura depois.
function renderDetailModalPreservingScroll(caseId){

  const panel = box ? box.querySelector('.tabpanel') : null;
  const scrollTop = panel ? panel.scrollTop : 0;

// Painel de custas — editável para Relacionamento/Recompras/Admin, só leitura pros demais (Vendas etc,
// que apenas consome o resultado já carregado da unidade, sem precisar entender a conta).
function renderCustasViabilidade(c){
  const editavel = podeEditarCustas();
  const values = buildViabilidadeValues(c);
  const total = totalViabilidade(values);
  const cfg = VIAB_CONFIG;
  const clas = viabClassificacao(total);
  const statusHtml = clas.key==='inviavel'
    ? `<span class="badge warn" style="background:var(--warn-soft);color:var(--warn)">${clas.icon} ${clas.label} — ${clas.desc}</span>`
    : `<span class="badge ${clas.cls}">${clas.icon} ${clas.label} — ${clas.desc}</span>`;
  const faltando = viabCamposFaltando(c);
  const avisoObrigatorio = (editavel && faltando.length) ? `<div class="warn-flag" style="margin-bottom:10px">⚠ Confirme antes de liberar pra Vendas (mesmo que seja R$0): ${faltando.map(esc).join('; ')}.</div>` : '';
  const categoriaHtml = c.categoriaUso ? ` <span class="badge muted" title="Categoria de uso">${esc(c.categoriaUso)}</span>` : '';
  const metragemHtml = editavel ? `<div style="margin-bottom:12px">
      <label class="fieldlbl">Área da unidade (m²) <span class="sub" style="font-weight:400">— usada só pra projetar a cota condominial (item 10)</span></label>
      <input type="text" value="${c.metragemM2||''}" onchange="updateMetragem(${c.id}, this.value)" placeholder="Ex: 65" style="width:120px;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text)">${categoriaHtml}
    </div>` : (c.categoriaUso ? `<div style="margin-bottom:12px">${categoriaHtml}</div>` : '');
  // Só o item marcado editavel:true (Novo Valor de Venda) vira input — todo o resto é sempre
  // texto fixo, puxado de Custas — Cadastro ou calculado por fórmula, nunca digitado aqui.
  const rows = VIAB_ITEMS.map(it=>{
    const overridden = it.editavel && c.viabOverrides && c.viabOverrides[it.id]!==undefined;
    let tag = '';
    if(overridden) tag = ' <span class="sub" style="font-size:10px;color:var(--info)">(editado)</span>';
    else if(it.editavel) tag = '';
    else if(it.tipo==='manual' && it.pendente) tag = ' <span class="sub" style="font-size:10px;color:var(--warn)">(sem fórmula — sempre R$0, precisa entrar em Custas — Cadastro)</span>';
    else if(it.tipo==='custafield') tag = ' <span class="sub" style="font-size:10px">(de Custas — Cadastro)</span>';
    else tag = ' <span class="sub" style="font-size:10px">(auto)</span>';
    const podeEditarEsteItem = podeEditarNovoValorVenda() && it.editavel;
    return `<tr>
      <td style="font-size:12px">${esc(it.desc)}${tag}</td>
      <td style="text-align:right;width:130px">${podeEditarEsteItem
        ? `<input type="text" value="${fmtMoney(values[it.id]).replace('R$ ','')}" onchange="updateViabItem(${c.id}, ${it.id}, this.value)" style="width:100%;text-align:right;font-size:12.5px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)">`
        : fmtMoney(values[it.id])}</td>
    </tr>`;
  }).join('');
  return `
    <p style="margin-top:0">Conta de viabilidade da recompra — receita da nova venda menos os custos envolvidos, pré-preenchida com os dados já conhecidos da unidade.${podeEditarNovoValorVenda()?' Só o "Novo Valor de Venda" pode ser ajustado aqui — todo o resto vem de Custas — Cadastro (ajuste lá se algum custo mudou).':' Só Retomada, Vendas e Administração podem editar o Novo Valor de Venda.'}</p>
    ${avisoObrigatorio}
    ${metragemHtml}
    <div class="tablewrap"><table class="parctable">
      <thead><tr><th>Item</th><th class="num">Valor</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="result-block" style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:9px;padding:12px 16px;margin-top:10px">
      <div><div class="sub" style="margin-bottom:3px">Resultado</div>${statusHtml}</div>
      <div style="font-size:22px;font-weight:750;color:${total>=cfg.thMin?'var(--ok)':'var(--warn)'}">${fmtMoney(total)}</div>
    </div>
  `;
}
function updateViabItem(caseId, itemId, rawVal){
  const c = findCase(caseId);
  const item = VIAB_ITEMS.find(it=>it.id===itemId);
  const before = buildViabilidadeValues(c)[itemId]; // valor exibido antes desta edição (auto ou já sobrescrito)
  const num = round2(parseFloat(String(rawVal).replace(/\./g,'').replace(',','.')) || 0);
  if(!c.viabOverrides) c.viabOverrides = {};
  c.viabOverrides[itemId] = num;
  if(num !== before){
    logHistory(c, `Viabilidade — "${item ? item.desc : 'item '+itemId}" ajustado manualmente: ${fmtMoney(before)} → ${fmtMoney(num)}`, null);
  }
  saveDB();
  detailTab = 'financeiro';
  renderDetailModalPreservingScroll(caseId);
}

function salvarVendaNova(caseId){
  const c = findCase(caseId);

  const comp = (g('vnComprador')&&g('vnComprador').value||'').trim(); if(comp) novo.comprador = comp;
  const raw = (g('vnValor')&&g('vnValor').value||'').trim(); if(raw){ const nv = parseFloat(raw.replace(/\./g,'').replace(',','.')); if(!isNaN(nv)) novo.valorNegociado = round2(nv); }

    const valor = valorRaw ? parseFloat(valorRaw.replace(/\./g,'').replace(',','.')) : 0;
    const data = row.querySelector('.vnpData').value || undefined;
    if(qtd>0 && valor>0) parcelas.push({tipo, qtd, valor: round2(valor), data});
  });
  if(parcelas.length) novo.parcelas = parcelas;
  c.vendaNovaManual = Object.keys(novo).length ? novo : undefined;
